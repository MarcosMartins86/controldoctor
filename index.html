<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ControlDoctor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Ctext x='16' y='23' font-family='Arial,Helvetica,sans-serif' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3ECD%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f4f6f8; --surface:#ffffff; --surface-2:#f8fafc; --border:#e3e8ee;
    --text:#1c2733; --muted:#64748b; --accent:#0f766e; --accent-soft:#e6f4f2;
    --indigo:#4f46e5; --amber:#b45309; --amber-soft:#fef3c7;
    --red:#b91c1c; --red-soft:#fee2e2; --green:#15803d; --green-soft:#dcfce7;
    --blue:#1d4ed8; --blue-soft:#dbeafe;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
  h1,h2,h3,h4{margin:0;font-weight:650}
  a{color:var(--accent)}
  button{font-family:inherit;font-size:14px;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;
    background:linear-gradient(135deg,#0f766e 0%,#155e63 45%,#1e3a8a 100%)}
  .login-card{background:var(--surface);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:100%;max-width:400px;padding:32px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .brand-name{font-size:19px;font-weight:750;letter-spacing:-.01em}
  .brand-name span{color:var(--accent)}
  .login-sub{color:var(--muted);font-size:13px;margin:6px 0 22px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600}
  .btn:hover{background:var(--surface-2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;width:100%;padding:10px}
  .btn-primary:hover{background:#0c5f58}
  .btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
  .btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn-danger{color:var(--red);border-color:var(--red-soft)}
  .btn-danger:hover{background:var(--red-soft)}
  .demo-box{margin-top:18px;padding:13px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;font-size:12.5px;color:var(--muted)}
  .demo-box b{color:var(--text)}
  .acct{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;margin-top:7px}
  .acct:hover{background:var(--accent-soft);border-color:var(--accent)}
  .acct .who{display:flex;flex-direction:column;min-width:0}
  .acct .who b{color:var(--text);font-size:13px}
  .acct .who span{font-size:11.5px;color:var(--muted)}
  .acct .role{font-size:11px;color:var(--muted);white-space:nowrap;text-align:right}
  .link-btn{background:none;border:none;color:var(--accent);font-weight:600;padding:0}
  .err{color:var(--red);font-size:12.5px;margin-top:8px;min-height:16px}

  /* ---------- Shell ---------- */
  .shell{display:flex;min-height:100vh}
  .sidebar{width:222px;flex-shrink:0;background:#0e2a2a;color:#c9d9d7;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .sidebar .brand{padding:18px 18px 14px;color:#fff}
  .sidebar .brand-name{color:#fff;font-size:17px}
  .sidebar .brand-name span{color:#5eead4}
  .nav-group{padding:6px 10px}
  .nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#5f807d;padding:12px 10px 6px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#c9d9d7;text-decoration:none;font-weight:550;font-size:13.5px;border:none;background:none;width:100%;text-align:left}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-item.active{background:var(--accent);color:#fff}
  .nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.9}
  .sidebar-foot{margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#8ca9a6}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}
  .topbar .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .content{padding:24px 26px;max-width:1180px;width:100%}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
  .page-head h1{font-size:20px}
  .page-head p{margin:3px 0 0;color:var(--muted);font-size:13px}

  /* ---------- Cards / KPIs ---------- */
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .kpi .label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
  .kpi .value{font-size:22px;font-weight:730;letter-spacing:-.02em}
  .kpi .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
  .kpi.klick{cursor:pointer;transition:box-shadow .12s,transform .12s}
  .kpi.klick:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(16,24,40,.12)}
  .kpi.accent .value{color:var(--accent)}
  .kpi.amber .value{color:var(--amber)}
  .kpi.red .value{color:var(--red)}
  .kpi.green .value{color:var(--green)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px}
  .card-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .card-head h3{font-size:14.5px}
  .card-body{padding:14px 16px}
  .card-body.flush{padding:0}

  /* ---------- Tables ---------- */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--surface-2)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .t-wrap{overflow-x:auto}
  .row-click{cursor:pointer}
  .sub-row td{background:var(--surface-2);border-bottom:1px solid var(--border)}

  /* ---------- Badges ---------- */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:650;white-space:nowrap}
  .b-green{background:var(--green-soft);color:var(--green)}
  .b-amber{background:var(--amber-soft);color:var(--amber)}
  .b-red{background:var(--red-soft);color:var(--red)}
  .b-blue{background:var(--blue-soft);color:var(--blue)}
  .b-gray{background:#eef1f4;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block}

  /* ---------- Toolbar / filters ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
  .toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
  .toolbar .search{min-width:180px}
  .toolbar .flt-range{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .toolbar .flt-range input{color:var(--text)}
  .toolbar .rng{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .toolbar .rng input{color:var(--text)}
  .spacer{flex:1}
  .bulk-bar{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);padding:9px 14px;margin-bottom:12px;font-size:13px}
  tr.row-sel td{background:var(--accent-soft)}
  .tbl-compact{font-size:12.5px}
  .tbl-compact th,.tbl-compact td{padding:8px 8px}
  .tbl-compact .hint-txt{margin-top:1px;font-size:11px}
  .chev{border:none;background:none;cursor:pointer;font-size:20px;line-height:1;color:var(--muted);padding:0 4px}
  .chev:hover{color:var(--accent)}

  /* ---------- Resumo executivo ---------- */
  .insights{background:linear-gradient(180deg,var(--accent-soft),var(--surface));border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);padding:13px 16px;margin-bottom:18px}
  .insights h3{font-size:13px;margin-bottom:7px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
  .insights ul{margin:0;padding-left:18px}
  .insights li{margin:4px 0;font-size:13px;line-height:1.45}
  .sec-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .hbars{display:flex;flex-direction:column;gap:9px;padding:2px}
  .hbar{display:grid;grid-template-columns:minmax(110px,150px) 1fr auto;align-items:center;gap:10px}
  .hbar-lbl{font-size:12px;font-weight:600;line-height:1.25;min-width:0;overflow:hidden}
  .hbar-lbl .hbar-sub{display:block;font-weight:400;color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbar-track{height:15px;background:var(--surface-2);border-radius:5px;overflow:hidden}
  .hbar-fill{height:100%;border-radius:5px;min-width:2px}
  .hbar-val{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .mlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:8px;color:var(--muted)}
  .mlegend span{display:inline-flex;align-items:center;gap:6px}
  .mlegend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  @media(max-width:820px){ .sec-grid{grid-template-columns:1fr} }

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,23,32,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
  .modal{background:var(--surface);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.3);width:100%;max-width:720px;margin:auto}
  .modal.lg{max-width:920px}
  .modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .modal-head h3{font-size:16px}
  .modal-body{padding:18px 20px;max-height:calc(100vh - 220px);overflow-y:auto}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px;background:var(--surface-2);border-radius:0 0 14px 14px}
  .x-btn{border:none;background:none;font-size:20px;color:var(--muted);line-height:1;padding:4px}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .form-grid .full{grid-column:1/-1}
  .form-grid label,.stack label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .form-grid input,.form-grid select,.form-grid textarea,.stack input,.stack select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
  .form-grid input:focus,.form-grid select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}

  .proc-table th,.proc-table td{padding:7px 8px}
  .proc-table input,.proc-table select{width:100%;padding:6px 7px;border:1px solid var(--border);border-radius:6px}
  .info-dot{flex:none;width:18px;height:18px;padding:0;border:none;border-radius:50%;background:var(--indigo);color:#fff;font:italic 700 11px/18px Georgia,serif;text-align:center;cursor:pointer}
  .info-dot:hover{filter:brightness(1.15)}
  .cbhpm-cell{position:relative}
  .cbhpm-drop{position:absolute;top:100%;left:0;right:0;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.16);max-height:240px;overflow-y:auto;margin-top:3px}
  .cbhpm-opt{padding:7px 10px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--border)}
  .cbhpm-opt:hover,.cbhpm-opt.hi{background:var(--accent-soft)}
  .cbhpm-opt .code{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}

  .empty{text-align:center;padding:44px 20px;color:var(--muted)}
  .empty svg{width:40px;height:40px;opacity:.4;margin-bottom:10px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12px;margin:3px 4px 3px 0}
  .checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
  .checks label{display:flex;align-items:center;gap:7px;font-weight:500;color:var(--text);font-size:13px;margin:0;padding:5px 6px;border-radius:6px}
  .checks label:hover{background:var(--surface-2)}
  .mini-bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;display:flex}
  .mini-bar span{display:block;height:100%}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0e2a2a;color:#fff;padding:11px 18px;border-radius:9px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:200;opacity:0;transition:opacity .2s,transform .2s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .hint-txt{font-size:12px;color:var(--muted);margin-top:4px}

  /* ---------- Convênio cards ---------- */
  .conv-grid{display:flex;flex-direction:column;gap:11px}
  .conv-card{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--cc,#0f766e);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 18px;display:flex;align-items:center;gap:22px;cursor:pointer;transition:box-shadow .15s,transform .15s}
  .conv-card:hover{box-shadow:0 6px 18px rgba(16,24,40,.13);transform:translateY(-1px)}
  .conv-card .cc-head{flex-shrink:0;width:150px}
  .conv-card .cc-name{font-weight:760;font-size:15px;color:var(--cc,#0f766e);line-height:1.25;word-break:break-word}
  .conv-card .cc-sub{font-size:12px;color:var(--muted);margin-top:3px}
  .conv-card .cc-edit{margin-top:7px;font-size:11.5px;color:var(--muted);opacity:0;transition:opacity .15s}
  .conv-card:hover .cc-edit{opacity:1}
  .cc-metrics{flex:1;min-width:0;display:flex;flex-direction:row;gap:14px}
  .cc-metric{flex:1;min-width:0;display:flex;gap:10px;align-items:stretch}
  .cc-metric .mbar{width:5px;border-radius:3px;flex-shrink:0}
  .cc-metric .mtxt{flex:1;min-width:0}
  .cc-metric .mlabel{font-weight:600;font-size:11.5px;line-height:1.3;color:var(--muted)}
  .cc-metric .mval{display:flex;align-items:baseline;gap:9px;font-variant-numeric:tabular-nums;margin-top:3px}
  .cc-metric .mval .mn{font-weight:750;font-size:15px}
  .cc-metric .mval .mv{font-weight:650;font-size:12.5px;color:var(--muted)}
  .hosp-card .cc-head{width:220px}
  .cc-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .cc-tag{font-size:10.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:1px 7px;line-height:1.6;white-space:nowrap}

  /* ---------- Modal tabs / OCR ---------- */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
  .tab-btn{border:none;background:none;padding:9px 13px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab-btn:hover{color:var(--text)}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab-btn .tnum{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--surface-2);align-items:center;justify-content:center;font-size:11px;margin-right:6px;vertical-align:middle}
  .tab-btn.active .tnum{background:var(--accent-soft);color:var(--accent)}
  .ocr-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border:1px dashed var(--border);border-radius:9px;padding:10px 12px;margin-bottom:14px}
  .ocr-bar .hint-txt{margin:0}
  .modal-body textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;font-size:14px;resize:vertical;line-height:1.5}
  .modal-body textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}

  @media(max-width:820px){
    .conv-card{flex-direction:column;align-items:stretch;gap:12px}
    .conv-card .cc-head{width:auto}
    .cc-metrics{flex-direction:column}
    .sidebar{position:fixed;left:-240px;z-index:50;transition:left .2s}
    .sidebar.open{left:0}
    .form-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
<script src="cbhpm.js"></script>
<script>
/* ============================================================
   ControlDoctor (2M Consultoria)
   Login/autenticação: Supabase.  Dados: neste navegador (localStorage),
   com exportação/importação de backup. Nenhum dado de paciente vai
   para servidor nesta versão.
   ============================================================ */

const LS_DB = 'controldoctor.db.v2';
const LS_SESSION = 'controldoctor.session.v2';

/* ---------------- Supabase ---------------- */
const SB_URL = 'https://dgkdpczzhvyldpvwkutk.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRna2RwY3p6aHZ5bGRwdndrdXRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2Mjc0NzUsImV4cCI6MjEwNDIwMzQ3NX0.nRtCXtrFdBdqJLp_RF9gs9MKE0YNK89cizVW94zAgKQ';
const SB_ON  = /^https:\/\/.+\.supabase\.co$/.test(SB_URL) && SB_KEY.length > 20;
const sb = SB_ON ? window.supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true } }) : null;

/* ---------------- utils ---------------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const money0 = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const todayISO = () => new Date().toISOString().slice(0,10);
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function fmtMonth(iso){ if(!iso) return '—'; const [y,m]=iso.split('-'); return `${['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m-1]}/${y}`; }
function daysSince(iso){ if(!iso) return 0; return Math.floor((Date.now()-new Date(iso+'T00:00:00'))/86400000); }
function fmtCbhpm(c){ c=String(c||'').replace(/\D/g,''); if(c.length<8) return c; return `${c[0]}.${c.slice(1,3)}.${c.slice(3,5)}.${c.slice(5,7)}-${c.slice(7)}`; }

/* LGPD / minimização: nomes de paciente são reduzidos a iniciais antes de gravar.
   "Maria Jose da Silva Chagas" -> "M.J.S.C."  ·  "PAC-042" ou "João" -> mantidos.
   Idempotente: reprocessar um valor já reduzido não muda nada. */
function acronimoNome(nome){
  const s=String(nome||'').trim();
  if(!s) return '';
  if(/\d/.test(s)) return s;                                  // contém número -> é código, não mexe
  const STOP=/^(de|da|do|das|dos|e|di|del|van|von|la|le|dos)$/i;
  const signif=s.split(/\s+/).filter(w=>w.length>0 && !STOP.test(w));
  if(signif.length<2) return s;                               // 1 palavra significativa -> mantém
  return signif.map(w=>w[0].toUpperCase()).join('.')+'.';
}

/* ---------------- CBHPM reference ---------------- */
const CBHPM = (window.CBHPM_DATA||[]).map(x=>({codigo:x.c, nome:x.d, porte:x.p}));
const CBHPM_BY_CODE = Object.fromEntries(CBHPM.map(x=>[x.codigo,x]));
function cbhpmSearch(q){
  q=(q||'').trim().toLowerCase();
  if(!q) return [];
  const digits=q.replace(/\D/g,'');
  const out=[];
  for(const p of CBHPM){
    if((digits && p.codigo.includes(digits)) || (q.length>=3 && p.nome.toLowerCase().includes(q))){
      out.push(p); if(out.length>=40) break;
    }
  }
  return out;
}

/* ---------------- business rules ---------------- */
function situacao(p){
  const prev=+p.valorPrevisto||0, pago=+p.valorPago||0;
  // recusa do plano = não foi aprovado antes da cirurgia; não entra em pagamentos/glosa
  if(p.statusPlano==='Recusado') return 'Recusado pelo plano';
  // recusa da auditoria sem pagamento = glosa integral
  if(p.statusAuditoria==='Recusado' && !pago && !p.dataPagamento) return 'Glosado';
  if(p.dataPagamento){
    if(pago>=prev && prev>0) return 'Pago';
    if(pago>0) return 'Glosa parcial';
    return 'Glosado';
  }
  return 'A receber';
}
const SIT_BADGE = {
  'Pago':'b-green','A receber':'b-amber','Glosa parcial':'b-red','Glosado':'b-red','Recusado pelo plano':'b-gray'
};
function saldoAberto(p){ // valor ainda esperado
  if(situacao(p)!=='A receber') return 0;
  return (+p.valorPrevisto||0) - (+p.valorPago||0);
}
function glosaDe(p){
  const s=situacao(p);
  if(s==='Glosa parcial'||s==='Glosado') return (+p.valorPrevisto||0)-(+p.valorPago||0);
  return 0;
}
/* média histórica efetivamente paga — mesmo código + mesmo convênio + mesmo papel (estrito).
   O papel importa: cirurgião, 1º/2º auxiliar e anestesista recebem valores distintos. */
function mediaPagaHistorica(codigo, convenioId, papel, exceptId){
  const code=String(codigo||'').replace(/\D/g,'');
  if(!code || !convenioId) return null;
  const vals=myProcs().filter(p=>{
    if(p.id===exceptId) return false;
    if(String(p.codigo).replace(/\D/g,'')!==code) return false;
    if(!((+p.valorPago||0)>0)) return false;
    const c=cirOf(p.cirurgiaId)||{};
    if(c.convenioId!==convenioId) return false;
    if(papel && (c.papel||'')!==papel) return false;
    return true;
  }).map(p=>+p.valorPago||0);
  if(!vals.length) return null;
  return { media: Math.round(vals.reduce((s,v)=>s+v,0)/vals.length*100)/100, n: vals.length };
}

const cirTotais = cirId => {
  const ps=procsOf(cirId);
  return {
    previsto: ps.reduce((s,p)=>s+(+p.valorPrevisto||0),0),
    pago: ps.reduce((s,p)=>s+(+p.valorPago||0),0),
    aberto: ps.reduce((s,p)=>s+saldoAberto(p),0),
    glosa: ps.reduce((s,p)=>s+glosaDe(p),0),
    n: ps.length
  };
};

const BUCKETS = ['0–30','31–60','61–90','91–120','+120'];
function bucketOf(iso){
  const d=daysSince(iso);
  if(d<=30) return '0–30';
  if(d<=60) return '31–60';
  if(d<=90) return '61–90';
  if(d<=120) return '91–120';
  return '+120';
}

  <div class="login-wrap"><div class="login-card" style="max-width:560px">
    <div class="brand"><div class="brand-mark">CD</div><div class="brand-name">Control<span>Doctor</span></div></div>
    <h3 style="margin:16px 0 4px;font-size:17px">Responsabilidade sobre os dados</h3>
    <div class="login-sub" style="margin-bottom:16px">Olá, ${esc(med.nome)}. Leia antes de continuar.</div>

    <div style="font-size:13px;line-height:1.55;color:var(--text)">
      <p style="margin:0 0 12px">Você é o <b>responsável (controlador)</b> pelos dados dos seus pacientes registrados nesta ferramenta. Os dados ficam <b>apenas neste dispositivo/navegador</b> — não são enviados para nenhum servidor.</p>
      <p style="margin:0 0 8px;font-weight:650">Ao usar o ControlDoctor, você se compromete a:</p>
      <ul style="margin:0 0 12px;padding-left:20px">
        <li style="margin:5px 0"><b>Nunca registrar nome completo, CPF, RG, telefone, e-mail ou endereço</b> do paciente. Use apenas iniciais ou um código.</li>
        <li style="margin:5px 0">Não incluir, no campo <b>Cirurgia / Observações</b> ou em qualquer outro, informações que identifiquem o paciente.</li>
        <li style="margin:5px 0">O número do prontuário sozinho não identifica o paciente. A ligação entre esse número e o nome real deve ficar <b>apenas no sistema da sua clínica</b> — nunca aqui.</li>
        <li style="margin:5px 0">Não usar em <b>computador compartilhado</b>; encerrar a sessão ao terminar.</li>
        <li style="margin:5px 0">Garantir uma <b>base legal</b> para o tratamento (tutela da saúde / execução de contrato) e informar o paciente quando aplicável.</li>
      </ul>
      <p style="margin:0;color:var(--muted);font-size:12px">O sistema já reduz nomes a iniciais automaticamente, mas isso não substitui o seu cuidado.</p>
    </div>

    <label style="display:flex;gap:9px;align-items:flex-start;margin:16px 0 12px;font-size:13px;font-weight:500">
      <input type="checkbox" id="lg-ok" style="margin-top:2px"> Li e estou ciente das minhas responsabilidades como controlador dos dados.
    </label>
    <button class="btn btn-primary" id="lg-go" disabled>Entrar na ferramenta</button>

  </div></div>`;
}
function bindLgpd(){
  const cb=$('#lg-ok'), go=$('#lg-go');
  cb.onchange=()=>{ go.disabled=!cb.checked; };
  go.onclick=()=>{ if(!cb.checked) return; setLgpdOk(); state.view='cirurgias'; render(); };
  $('#lg-out').onclick=logout;
}

/* ============================================================
   VIEW: CIRURGIAS
   ============================================================ */
const PAPEIS = ['Cirurgião','1º Auxiliar','2º Auxiliar','Anestesista'];
const localOptions = () => [...new Set([...myHospitais().map(h=>h.nome), ...myConvenios().map(c=>c.nome)])].sort((a,b)=>a.localeCompare(b));

function viewCirurgias(){
  const root=$('#viewRoot');
  const f = state.filters.cir = Object.assign({pac:'',local:'',cp:'',sit:'',de:'',ate:''}, state.filters.cir||{});
  const all = myCirurgias().slice().sort((a,b)=>(b.dataCirurgia||'').localeCompare(a.dataCirurgia||''));
  const pacientes = [...new Set([...all.map(c=>c.paciente), ...all.map(c=>c.prontuario)].filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));

  const sel = new Set();   // seleção múltipla para exclusão em lote

  const applyFilters = () => all.filter(c=>{
    const ci = s => String(s||'').toLowerCase();
    if(f.pac){ const q=ci(f.pac); if(!ci(c.paciente).includes(q) && !ci(c.prontuario).includes(q)) return false; }
    if(f.local){ const q=ci(f.local); if(!ci(hospName(c.hospitalId)).includes(q) && !ci(convName(c.convenioId)).includes(q)) return false; }
    if(f.cp){ const i=f.cp.indexOf(':'), dim=f.cp.slice(0,i), val=f.cp.slice(i+1);
      if(dim==='car' && c.carater!==val) return false;
      if(dim==='papel' && (c.papel||'')!==val) return false;
    }
    if(f.de && (c.dataCirurgia||'') < f.de) return false;
    if(f.ate && (c.dataCirurgia||'') > f.ate) return false;
    if(f.sit){
      const sits=procsOf(c.id).map(situacao);
      if(f.sit==='aberto' && !sits.includes('A receber')) return false;
      if(f.sit==='pago' && !(sits.length && sits.every(x=>x==='Pago'))) return false;
      if(f.sit==='glosa' && !sits.some(x=>x==='Glosa parcial'||x==='Glosado'||x==='Recusado pelo plano')) return false;
    }
    return true;
  });

  root.innerHTML = `
    <div class="page-head">
      <div><h1>Procedimentos</h1><p id="cirCount"></p></div>
      <button class="btn btn-primary" style="width:auto" id="novaCir">+ Nova cirurgia</button>
    </div>
    <div class="toolbar">
      <input class="search" id="fpac" list="dlPac" placeholder="Nº prontuário ou paciente..." value="${esc(f.pac)}">
      <input class="search" id="flocal" list="dlLocal" placeholder="Hospital ou convênio..." value="${esc(f.local)}">
      <select id="fcp">
        <option value="">Caráter / papel: todos</option>
        <optgroup label="Caráter">
          <option value="car:Eletiva" ${f.cp==='car:Eletiva'?'selected':''}>Eletiva</option>
          <option value="car:Urgência" ${f.cp==='car:Urgência'?'selected':''}>Urgência</option>
        </optgroup>
        <optgroup label="Papel do médico">
          ${PAPEIS.map(p=>`<option value="papel:${esc(p)}" ${f.cp===('papel:'+p)?'selected':''}>${esc(p)}</option>`).join('')}
        </optgroup>
      </select>
      <select id="fsit"><option value="">Situação: todas</option>
        <option value="aberto" ${f.sit==='aberto'?'selected':''}>Com valor a receber</option>
        <option value="pago" ${f.sit==='pago'?'selected':''}>Totalmente pago</option>
        <option value="glosa" ${f.sit==='glosa'?'selected':''}>Com glosa/recusa</option>
      </select>
      <span class="flt-range">Cirurgia de <input type="date" id="fde" value="${f.de||''}"> até <input type="date" id="fate" value="${f.ate||''}"></span>
      <button class="btn btn-sm btn-ghost" id="fclear">Limpar</button>
    </div>
    <datalist id="dlPac">${pacientes.map(p=>`<option value="${esc(p)}"></option>`).join('')}</datalist>
    <datalist id="dlLocal">${localOptions().map(p=>`<option value="${esc(p)}"></option>`).join('')}</datalist>
    <div id="cirListWrap"></div>`;

  const paint = () => {
    const rows = applyFilters();
    [...sel].forEach(id=>{ if(!all.some(c=>c.id===id)) sel.delete(id); });
    $('#cirCount').textContent = `${rows.length} cirurgia(s) · lançamento de procedimentos e acompanhamento de pagamento`;
    const bar = sel.size ? `<div class="bulk-bar"><b>${sel.size}</b> registro(s) selecionado(s)
      <button class="btn btn-sm btn-danger" id="bulkDel">Excluir selecionados</button>
      <button class="btn btn-sm btn-ghost" id="bulkClear">Limpar seleção</button></div>` : '';
    const allChecked = rows.length>0 && rows.every(c=>sel.has(c.id));
    $('#cirListWrap').innerHTML = `${bar}
      <div class="card"><div class="card-body flush"><div class="t-wrap">
      ${rows.length? `<table class="tbl-compact"><thead><tr>
        <th style="width:26px"><input type="checkbox" id="selAll" ${allChecked?'checked':''}></th>
        <th>Data / cirurgia</th><th>Prontuário / paciente</th><th>Convênio / hospital</th><th>Caráter</th><th>Papel</th>
        <th class="num">Proc.</th><th class="num">Previsto</th><th class="num">Recebido</th><th class="num">A receber</th><th style="width:24px"></th>
      </tr></thead><tbody>
        ${rows.map(c=>{const t=cirTotais(c.id);return `
        <tr class="row-click${sel.has(c.id)?' row-sel':''}" data-cir="${c.id}">
          <td onclick="event.stopPropagation()"><input type="checkbox" class="rowsel" data-id="${c.id}" ${sel.has(c.id)?'checked':''}></td>
          <td><b>${fmtDate(c.dataCirurgia)}</b>${c.obs?`<div class="hint-txt">${esc(c.obs)}</div>`:''}</td>
          <td><b style="font-variant-numeric:tabular-nums">${esc(c.prontuario||'—')}</b><div class="hint-txt">${esc(c.paciente||'')}</div></td>
          <td>${esc(convName(c.convenioId))}<div class="hint-txt">${esc(hospName(c.hospitalId))}</div></td>
          <td>${carBadge(c.carater)}</td>
          <td>${esc(c.papel||'—')}</td>
          <td class="num">${t.n}</td>
          <td class="num">${money0(t.previsto)}</td>
          <td class="num" style="color:var(--green)">${money0(t.pago)}</td>
          <td class="num" style="color:${t.aberto>0?'var(--amber)':'var(--muted)'}">${money0(t.aberto)}</td>
          <td class="num"><button class="chev" data-edit="${c.id}" title="Abrir">&rsaquo;</button></td>
        </tr>`;}).join('')}
      </tbody></table>` : emptyState('Nenhuma cirurgia encontrada', all.length?'Ajuste os filtros para ampliar a busca.':'Clique em “Nova cirurgia” para começar.')}
      </div></div></div>`;
    $$('#cirListWrap [data-edit]').forEach(b=>b.onclick=e=>{e.stopPropagation();openCirurgia(b.dataset.edit);});
    $$('#cirListWrap [data-cir]').forEach(tr=>tr.onclick=()=>openCirurgia(tr.dataset.cir));
    $$('#cirListWrap .rowsel').forEach(cb=>cb.onclick=e=>{ e.stopPropagation();
      if(cb.checked) sel.add(cb.dataset.id); else sel.delete(cb.dataset.id); paint();
    });
    const selAll=$('#selAll');
    if(selAll) selAll.onclick=e=>{ e.stopPropagation();
      if(selAll.checked) rows.forEach(c=>sel.add(c.id)); else rows.forEach(c=>sel.delete(c.id)); paint();
    };
    if($('#bulkClear')) $('#bulkClear').onclick=()=>{ sel.clear(); paint(); };
    if($('#bulkDel')) $('#bulkDel').onclick=()=>{
      const n=sel.size;
      if(!confirm(`Excluir ${n} registro(s) e todos os procedimentos/pagamentos vinculados? Esta ação não pode ser desfeita.`)) return;
      const ids=[...sel];
      DB.cirurgias = DB.cirurgias.filter(c=>!sel.has(c.id));
      DB.procedimentos = DB.procedimentos.filter(p=>!ids.includes(p.cirurgiaId));
      save(); sel.clear(); toast(`${n} registro(s) excluído(s)`); viewCirurgias();
    };
  };

  $('#novaCir').onclick=()=>openCirurgia(null);
  const upd=(id,key,ev='input')=>{ const el=$('#'+id); el.addEventListener(ev,()=>{ f[key]=el.value; paint(); }); };
  upd('fpac','pac'); upd('flocal','local');
  upd('fcp','cp','change'); upd('fsit','sit','change');
  upd('fde','de','change'); upd('fate','ate','change');
  $('#fclear').onclick=()=>{ Object.assign(f,{pac:'',local:'',cp:'',sit:'',de:'',ate:''}); viewCirurgias(); };
  paint();
}
function carBadge(c){ return c==='Urgência'?`<span class="badge b-red">Urgência</span>`:`<span class="badge b-blue">Eletiva</span>`; }
function emptyState(t,s){ return `<div class="empty">${iconCal()}<div style="font-weight:600;margin-top:8px">${t}</div><div>${s||''}</div></div>`; }

/* ============================================================
   MODAL: CIRURGIA (cadastro redesenhado)
   ============================================================ */
let draft=null;
function openCirurgia(id){
  const existing = id ? cirOf(id) : null;
  draft = existing ? {
    ...existing,
    procs: procsOf(id).map(p=>({...p}))
  } : {
    id:null, paciente:'', prontuario:'', convenioId:'', hospitalId:'', dataSolicitacao:'', dataCirurgia:todayISO(),
    carater:'Eletiva', papel:'Cirurgião', obs:'', procs:[ blankProc() ]
  };
  draft._tab = 1;
  renderCirModal();
}
function blankProc(){ return {id:null, codigo:'', nome:'', porte:'', qtd:1, statusPlano:'Aguarda Aprovação', statusAuditoria:'Aguarda Auditoria', motivoRecusa:'', valorPrevisto:0, valorPago:0, dataPagamento:''}; }

const MOTIVOS_RECUSA = [
  'Ausência de autorização prévia',
  'Procedimento não coberto pelo plano',
  'Divergência de código / procedimento',
  'Falta de documentação / laudo',
  'Incompatibilidade CID × procedimento',
  'Quantidade acima do autorizado',
  'Procedimento em duplicidade',
  'Prazo de solicitação / envio expirado',
  'Carência não cumprida',
  'Auditoria técnica — não pertinente',
  'Pacote / diária já contempla o item',
  'Outro',
];

const CIR_TABS = [
  {n:1, label:'Dados da cirurgia'},
  {n:2, label:'Procedimentos e status'},
  {n:3, label:'Valores e pagamento'},
];

function renderCirModal(){
  const isNew = !draft.id;
  const tab = draft._tab = Math.max(1, Math.min(3, draft._tab||1));
  const convs = myConvenios(), hosps = myHospitais();
  const convOK = draft.convenioId ? (DB.convenios.find(c=>c.id===draft.convenioId)||{}).hospitalIds||[] : null;
  const tPrev = draft.procs.reduce((s,p)=>s+(+p.valorPrevisto||0),0);
  const tPago = draft.procs.reduce((s,p)=>s+(+p.valorPago||0),0);

  const tab1 = ()=>`
    <div class="form-grid">
      <div class="full"><label>Identificação do paciente *</label><input id="d-pac" value="${esc(draft.paciente)}" placeholder="nome, código ou apelido">
        <div class="hint-txt" id="d-pac-hint">Só as iniciais são gravadas (LGPD). Ex.: “Maria J. da Silva” → <b>M.J.S.</b></div>
      </div>
      <div class="full"><label>Nº prontuário</label><input id="d-pront" value="${esc(draft.prontuario||'')}" placeholder="número do prontuário no hospital"></div>
      <div><label>Convênio *</label><select id="d-conv"><option value="">Selecione...</option>${convs.map(c=>`<option value="${c.id}" ${draft.convenioId===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></div>
      <div><label>Hospital *</label><select id="d-hosp"><option value="">Selecione...</option>${hosps.map(h=>`<option value="${h.id}" ${draft.hospitalId===h.id?'selected':''}>${esc(h.nome)}</option>`).join('')}</select>
        ${convOK && draft.hospitalId && !convOK.includes(draft.hospitalId) ? `<div class="hint-txt" style="color:var(--amber)">⚠ Este convênio não está cadastrado para atender este hospital.</div>`:''}
      </div>
      <div><label>Data da solicitação</label><input id="d-dsol" type="date" value="${draft.dataSolicitacao||''}"></div>
      <div><label>Data da cirurgia *</label><input id="d-dcir" type="date" value="${draft.dataCirurgia||''}"></div>
      <div><label>Caráter</label><select id="d-car"><option ${draft.carater==='Eletiva'?'selected':''}>Eletiva</option><option ${draft.carater==='Urgência'?'selected':''}>Urgência</option></select></div>
      <div><label>Papel do médico</label><select id="d-papel">${['Cirurgião','1º Auxiliar','2º Auxiliar','Anestesista'].map(x=>`<option ${draft.papel===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="full"><label>Cirurgia / Observações</label><input id="d-obs" value="${esc(draft.obs||'')}" placeholder="ex.: Artroscopia de joelho direito — reconstrução de LCA"></div>
    </div>`;

  const tab2 = ()=>`
    <div class="hint-txt" style="margin-bottom:8px">Um procedimento CBHPM por linha. Os valores e pagamentos ficam na guia “Valores e pagamento”.</div>
    <div class="t-wrap"><table class="proc-table"><thead><tr>
      <th style="width:260px">Código / procedimento</th><th style="width:48px">Porte</th><th style="width:48px">Qtd</th>
      <th style="width:140px">Status plano</th><th style="width:140px">Status auditoria</th><th style="width:200px">Motivo da recusa</th><th style="width:34px"></th>
    </tr></thead><tbody id="procRows">
      ${draft.procs.map((p,i)=>procRowHtml(p,i)).join('')}
    </tbody></table></div>
    <button class="btn btn-sm" id="addProc" style="margin-top:10px">+ Adicionar procedimento</button>`;

  const tab3 = ()=>{
    const real = draft.procs.filter(p=>p.codigo);
    if(!real.length) return `<div class="empty">${iconCheck()}<div style="font-weight:600;margin-top:8px">Nenhum procedimento ainda</div><div>Adicione procedimentos na guia “Procedimentos e status”.</div></div>`;
    return `<div class="t-wrap"><table class="proc-table"><thead><tr>
      <th>Procedimento</th><th style="width:150px" class="num">Valor previsto</th><th style="width:120px" class="num">Valor pago</th><th style="width:150px">Data do pagamento</th>
    </tr></thead><tbody id="valRows">
      ${draft.procs.map((p,i)=>{ if(!p.codigo) return '';
        const mh=mediaPagaHistorica(p.codigo, draft.convenioId, draft.papel, p.id);
        const msg = mh
          ? `Sugestão pela média histórica: ${mh.n} pagamento(s) deste código neste convênio, média ${money(mh.media)}.${p._autoPrev?'':' Valor editado manualmente.'}`
          : 'Sem histórico deste código neste convênio — informe o valor manualmente.';
        return `<tr data-pi="${i}">
        <td style="vertical-align:middle"><span style="font-variant-numeric:tabular-nums;color:var(--muted)">${esc(fmtCbhpm(p.codigo))}</span><br>${esc(p.nome||'')}</td>
        <td style="vertical-align:middle"><div style="display:flex;align-items:center;gap:6px">
          <input data-f="valorPrevisto" type="number" step="0.01" class="num" value="${p.valorPrevisto||0}" style="flex:1;min-width:0">
          <button type="button" class="info-dot${mh?' on':''}" data-info="${esc(msg)}" title="Origem do valor previsto">i</button>
        </div></td>
        <td style="vertical-align:middle"><input data-f="valorPago" type="number" step="0.01" class="num" value="${p.valorPago||0}"></td>
        <td style="vertical-align:middle"><input data-f="dataPagamento" type="date" value="${p.dataPagamento||''}"></td>
      </tr>`; }).join('')}
    </tbody>
    <tfoot><tr>
      <td style="text-align:right;font-weight:650">Totais</td>
      <td class="num" id="tfPrev" style="font-weight:700">${money(tPrev)}</td>
      <td class="num" id="tfPago" style="font-weight:700;color:var(--green)">${money(tPago)}</td>
      <td></td>
    </tr></tfoot></table></div>
    <div class="hint-txt" style="margin-top:8px">Clique no <span class="info-dot on" style="cursor:default;display:inline-block;vertical-align:middle">i</span> ao lado do valor previsto para ver a origem da sugestão.</div>`;
  };

  const body = tab===1?tab1():tab===2?tab2():tab3();

  $('#modal-root').innerHTML = `
  <div class="overlay" id="ov">
    <div class="modal lg">
      <div class="modal-head">
        <h3>${isNew?'Nova cirurgia':'Cirurgia — '+esc(draft.paciente||'')}</h3>
        <button class="x-btn" id="mx">&times;</button>
      </div>
      <div class="modal-body">
        <div class="tabs">
          ${CIR_TABS.map(t=>`<button class="tab-btn ${tab===t.n?'active':''}" data-tab="${t.n}"><span class="tnum">${t.n}</span>${t.label}</button>`).join('')}
        </div>
        <div id="tabBody">${body}</div>
      </div>
      <div class="modal-foot">
        ${!isNew?`<button class="btn btn-danger" id="delCir" style="margin-right:auto">Excluir cirurgia</button>`:''}
        ${tab>1?`<button class="btn" id="prevTab">← Anterior</button>`:''}
        ${tab<3?`<button class="btn" id="nextTab">Próxima →</button>`:''}
        <button class="btn" id="mcancel">Cancelar</button>
        <button class="btn btn-primary" style="width:auto" id="msave">Salvar</button>
      </div>
    </div>
  </div>`;

  const close=()=>{ $('#modal-root').innerHTML=''; };
  $('#ov').onclick=e=>{ if(e.target.id==='ov') close(); };
  $('#mx').onclick=close; $('#mcancel').onclick=close;

  const goTab=n=>{ syncCirDraft(); draft._tab=n; renderCirModal(); };
  $$('[data-tab]').forEach(b=>b.onclick=()=>goTab(+b.dataset.tab));
  if($('#prevTab')) $('#prevTab').onclick=()=>goTab(tab-1);
  if($('#nextTab')) $('#nextTab').onclick=()=>goTab(tab+1);
  if($('#ocrBtn')) $('#ocrBtn').onclick=openOcrImport;   // OCR oculto nesta versão
  $('#msave').onclick=saveCirurgia;
  if($('#delCir')) $('#delCir').onclick=()=>{
    if(!confirm('Excluir esta cirurgia e seus procedimentos?')) return;
    DB.cirurgias=DB.cirurgias.filter(c=>c.id!==draft.id);
    DB.procedimentos=DB.procedimentos.filter(p=>p.cirurgiaId!==draft.id);
    save(); close(); toast('Cirurgia excluída'); render();
  };

  if(tab===1){
    const bind=(sel,key)=>{ const el=$(sel); if(!el) return; el.onchange=()=>{ draft[key]=el.value;
      if(el.id==='d-conv' || el.id==='d-papel') aplicarMediaHistorica();
      if(['d-conv','d-hosp','d-papel'].includes(el.id)) renderCirModal();
    }; };
    bind('#d-conv','convenioId'); bind('#d-hosp','hospitalId');
    bind('#d-dsol','dataSolicitacao'); bind('#d-dcir','dataCirurgia'); bind('#d-car','carater'); bind('#d-papel','papel');
    $('#d-pac').oninput=e=>{ draft.paciente=e.target.value;
      const a=acronimoNome(e.target.value), h=$('#d-pac-hint');
      if(h) h.innerHTML = (a && a!==e.target.value.trim())
        ? `Será gravado como <b>${esc(a)}</b>`
        : 'Só as iniciais são gravadas (LGPD). Ex.: “Maria J. da Silva” → <b>M.J.S.</b>';
    };
    $('#d-obs').oninput=e=>draft.obs=e.target.value;
    $('#d-pront').oninput=e=>draft.prontuario=e.target.value;
  } else if(tab===2){
    $('#addProc').onclick=()=>{ syncCirDraft(); draft.procs.push(blankProc()); renderCirModal(); };
    bindProcRows();
  } else if(tab===3){
    $$('#valRows [data-f]').forEach(el=>{ el.onchange=()=>{
      if(el.dataset.f==='valorPrevisto'){ const tr=el.closest('tr'); const p=draft.procs[+tr.dataset.pi]; if(p) p._autoPrev=false; }
      syncCirDraft(); updateValTotals();
    }; });
    $$('#valRows .info-dot').forEach(b=>b.onclick=()=>toast(b.dataset.info));
  }
}

/* preenche valorPrevisto pela média histórica paga, para procs sem valor manual */
function aplicarMediaHistorica(){
  draft.procs.forEach(p=>{
    if(!p.codigo) return;
    if((+p.valorPrevisto||0)>0 && !p._autoPrev) return; // valor manual — não mexe
    const mh=mediaPagaHistorica(p.codigo, draft.convenioId, draft.papel, p.id);
    if(mh){ p.valorPrevisto=mh.media; p._autoPrev=true; }
    else if(p._autoPrev){ p.valorPrevisto=0; p._autoPrev=false; }
  });
}

function bindProcRows(){
  $$('#procRows tr').forEach(tr=>{
    const i=+tr.dataset.pi;
    tr.querySelectorAll('[data-f]:not(.cb-input)').forEach(el=>{
      el.onchange=()=>{ syncCirDraft(); if(el.dataset.rerender) renderCirModal(); };
    });
    tr.querySelector('[data-del]').onclick=()=>{
      syncCirDraft();
      const p=draft.procs[i]||{};
      const preenchido = p.codigo || (+p.valorPrevisto||0) || (+p.valorPago||0);
      if(preenchido && !confirm(`Remover o procedimento ${p.codigo?fmtCbhpm(p.codigo):''} desta cirurgia?`)) return;
      draft.procs.splice(i,1); if(!draft.procs.length)draft.procs.push(blankProc()); renderCirModal();
    };
    const inp=tr.querySelector('.cb-input');
    const drop=tr.querySelector('.cbhpm-drop');
    let hi=-1, matches=[];
    const showMatches=()=>{
      const raw=inp.value;
      matches=cbhpmSearch(raw);
      if(!matches.length){ drop.style.display='none'; return; }
      drop.innerHTML=matches.map((m,k)=>`<div class="cbhpm-opt ${k===hi?'hi':''}" data-k="${k}"><span class="code">${fmtCbhpm(m.codigo)}</span> — ${esc(m.nome)} <span style="color:var(--muted)">(${m.porte})</span></div>`).join('');
      drop.style.display='block';
      drop.querySelectorAll('.cbhpm-opt').forEach(o=>o.onmousedown=e=>{ e.preventDefault(); pick(+o.dataset.k); });
    };
    const pick=k=>{
      const m=matches[k]; if(!m) return;
      const p=draft.procs[i];
      p.codigo=m.codigo; p.nome=m.nome; p.porte=m.porte;
      // valor previsto: média histórica paga (código + convênio), se ainda não houver valor manual
      const mh=mediaPagaHistorica(p.codigo, draft.convenioId, draft.papel, p.id);
      if(mh && ((+p.valorPrevisto||0)===0 || p._autoPrev)){ p.valorPrevisto=mh.media; p._autoPrev=true; }
      inp.value=fmtCbhpm(m.codigo)+' — '+m.nome;
      drop.style.display='none';
      renderCirModal();
    };
    inp.oninput=()=>{ hi=-1; showMatches(); };
    inp.onfocus=()=>{ if(inp.value) showMatches(); };
    inp.onblur=()=>{ setTimeout(()=>drop.style.display='none',150);
      if(!inp.value.trim()){ draft.procs[i].codigo='';draft.procs[i].nome='';draft.procs[i].porte=''; } };
    inp.onkeydown=e=>{
      if(drop.style.display==='none') return;
      if(e.key==='ArrowDown'){ hi=Math.min(hi+1,matches.length-1); showMatches(); e.preventDefault(); }
      else if(e.key==='ArrowUp'){ hi=Math.max(hi-1,0); showMatches(); e.preventDefault(); }
      else if(e.key==='Enter'){ if(hi>=0){ pick(hi); e.preventDefault(); } }
      else if(e.key==='Escape'){ drop.style.display='none'; }
    };
  });
}
function updateValTotals(){
  const tPrev=draft.procs.reduce((s,p)=>s+(+p.valorPrevisto||0),0);

  if($('#tfPrev')) $('#tfPrev').textContent=money(tPrev);
  if($('#tfPago')) $('#tfPago').textContent=money(tPago);
}

function ocrExtractMock(files){
  const r = ocrEmpty();
  r._fonte.arquivos = [...files].map(f=>f.name);
  r._fonte.geradoEm = new Date().toISOString();
  const nomes = r._fonte.arquivos.join(' ');
  const hit = OCR_AMOSTRAS.find(s=>s.re.test(nomes));
  if(hit){
    r._fonte.engine = 'amostra';
    Object.assign(r, JSON.parse(JSON.stringify(hit.dados)));
    r.paciente = acronimoNome(r.paciente);   // minimização já na leitura
    r.procedimentos = (r.procedimentos||[]).map(p=>({codigo:p.codigo,nome:'',qtd:p.qtd||1,statusPlano:'Aguarda Aprovação',statusAuditoria:'Aguarda Auditoria',valorPrevisto:0,valorPago:0,dataPagamento:''}));

    return r;
  }
  // sem amostra correspondente → estrutura vazia (leitor real ainda não plugado)
  r._fonte.engine = 'mock';
  r.dataCirurgia = todayISO();
  r.carater = 'Eletiva';
  r.papel = 'Cirurgião';
  r.procedimentos = [{codigo:'', nome:'', qtd:1, statusPlano:'Aguarda Aprovação', statusAuditoria:'Aguarda Auditoria', valorPrevisto:0, valorPago:0, dataPagamento:''}];

}

function aplicarOcr(r){
  const d=draft;
  const set = (k,val) => { if(val!=null && String(val).trim()!=='') d[k]=val; };
  set('paciente', r.paciente); set('prontuario', r.prontuario); set('dataSolicitacao', r.dataSolicitacao); set('dataCirurgia', r.dataCirurgia);
  set('carater', r.carater); set('papel', r.papel); set('obs', r.obs);
  if(r.convenio && r.convenio.trim()){
    const nm=r.convenio.trim();
    let cv=myConvenios().find(c=>c.nome.toLowerCase()===nm.toLowerCase());
    if(!cv){ cv={id:uid('con'),medicoId:M(),nome:nm,hospitalIds:[]}; DB.convenios.push(cv); save(); }
    d.convenioId=cv.id;
  }
  if(r.hospital && r.hospital.trim()){
    const nm=r.hospital.trim();
    let h=myHospitais().find(x=>x.nome.toLowerCase()===nm.toLowerCase());
    if(!h){ h={id:uid('hos'),medicoId:M(),nome:nm,rede:''}; DB.hospitais.push(h); save(); }
    d.hospitalId=h.id;
    if(d.convenioId){ const cv=DB.convenios.find(c=>c.id===d.convenioId); if(cv && !(cv.hospitalIds||[]).includes(h.id)){ cv.hospitalIds=[...(cv.hospitalIds||[]),h.id]; save(); } }
  }
  const rows = (r.procedimentos||[]).map(p=>{
    const code = String(p.codigo||'').replace(/\D/g,'');
    const ref = CBHPM_BY_CODE[code] || {};
    return { id:null, codigo:ref.codigo||code||'', nome:ref.nome||p.nome||'', porte:ref.porte||'',
      qtd:+p.qtd||1, statusPlano:p.statusPlano||'Aguarda Aprovação', statusAuditoria:p.statusAuditoria||'Aguarda Auditoria',
      valorPrevisto:+p.valorPrevisto||0, valorPago:+p.valorPago||0, dataPagamento:p.dataPagamento||'' };
  }).filter(p=>p.codigo);
  if(rows.length){
    const existing = d.procs.filter(p=>p.codigo);
    d.procs = r._merge ? existing.concat(rows) : rows;
  }
  if(!d.procs.length) d.procs=[blankProc()];
  d._ocr = { arquivos:r._fonte.arquivos, geradoEm:r._fonte.geradoEm, engine:r._fonte.engine };
}

/* ============================================================
   CONCILIAÇÃO — extrato de pagamento em lote do convênio (MOCK)
   Cruza os itens do extrato com os procedimentos em aberto e
   registra os pagamentos em massa. Ponto único para plugar a
   leitura real depois: produzir { _fonte, itens:[...] } e chamar
   aplicarConciliacao().
   item: {procId?, codigo, procedimento, paciente, convenio, hospital,
          competencia, valorApresentado, valorPago, dataPagamento, glosa, motivoGlosa}
   ============================================================ */
function conciliacaoScanMock(files){
  // MOCK: não lê o arquivo. Simula um extrato que "encontrou" os
  // procedimentos em aberto, pagos a ~90% do previsto (10% de glosa de tabela).
  const r={ _fonte:{arquivos:[...files].map(f=>f.name), geradoEm:new Date().toISOString(), engine:'mock'}, itens:[] };
  myProcs().map(p=>({p,c:cirOf(p.cirurgiaId)}))
    .filter(x=>x.c && saldoAberto(x.p)>0)
    .forEach(({p,c})=>{
      const prev=+p.valorPrevisto||0;
      r.itens.push({
        procId:p.id, codigo:p.codigo, procedimento:p.nome||'',
        paciente:c.paciente||'', convenio:convName(c.convenioId), hospital:hospName(c.hospitalId),
        competencia:(c.dataCirurgia||todayISO()).slice(0,7),
        valorApresentado:prev, valorPago: prev?Math.round(prev*90)/100:0,
        dataPagamento:todayISO(), glosa: prev?Math.round(prev*10)/100:0, motivoGlosa: prev?'Diferença de tabela':''
      });
    });
  return r;
}
function conciliacaoMatch(it){
  if(it.procId){ const p=DB.procedimentos.find(x=>x.id===it.procId); if(p) return p; }
  const code=String(it.codigo||'').replace(/\D/g,'');
  if(!code) return null;
  const cand=myProcs().map(p=>({p,c:cirOf(p.cirurgiaId)})).filter(x=>x.c
    && String(x.p.codigo).replace(/\D/g,'')===code
    && (!it.paciente || (x.c.paciente||'').toLowerCase()===String(it.paciente).toLowerCase()));
  return cand.length===1 ? cand[0].p : null;
}

        <p class="hint-txt" style="margin-top:0">Carregue o extrato de pagamento do convênio (PDF, planilha ou foto). O sistema cruza os itens com os procedimentos em aberto e registra os pagamentos em massa.</p>
        <input type="file" id="concFile" accept="image/*,application/pdf,.csv,.xlsx,.xls" multiple>
        <div id="concReview" style="margin-top:14px"></div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="concCancel">Fechar</button>
        <button class="btn btn-primary" style="width:auto;display:none" id="concApply">Aplicar</button>
      </div>
    </div>
  </div>`);
  const ov=$('#concOv'); const close=()=>ov.remove();
  $('#concX').onclick=close; $('#concCancel').onclick=close;
  ov.onclick=e=>{ if(e.target.id==='concOv') close(); };
  let result=null;
  $('#concFile').onchange=e=>{
    const files=[...e.target.files]; if(!files.length) return;
    result=conciliacaoScanMock(files);
    $('#concReview').innerHTML=conciliacaoReviewHtml(result);
    const n=(result.itens||[]).filter(conciliacaoMatch).length;
    const btn=$('#concApply'); btn.style.display=''; btn.disabled=!n;
    btn.textContent = n ? `Aplicar a ${n} procedimento(s)` : 'Nenhuma correspondência';
  };
  $('#concApply').onclick=()=>{
    if(!result) return;
    const n=aplicarConciliacao(result);
    close(); toast(n?`${n} procedimento(s) conciliado(s)`:'Nenhum item correspondeu'); render();
  };
}
function conciliacaoReviewHtml(r){
  const itens=r.itens||[];
  const matched=itens.filter(conciliacaoMatch).length;
  return `
  <div class="hint-txt" style="background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:9px 11px;margin-bottom:10px">
    ⚠ Conciliação em modo demonstração (mock): os itens abaixo <b>não</b> foram lidos do arquivo. Estrutura pronta para plugar a leitura real do extrato.
  </div>
  <div class="hint-txt" style="margin-bottom:8px">${itens.length} item(ns) no extrato · <b>${matched}</b> com correspondência nos procedimentos em aberto.</div>
  <div class="t-wrap"><table><thead><tr>
    <th>Código</th><th>Paciente</th><th>Convênio</th><th>Hospital</th><th class="num">Apresentado</th><th class="num">Pago</th><th class="num">Glosa</th><th>Data pgto</th><th></th>
  </tr></thead><tbody>
    ${itens.map(it=>{
      const m=conciliacaoMatch(it);
      return `<tr>
        <td style="font-variant-numeric:tabular-nums">${esc(fmtCbhpm(it.codigo))}</td>
        <td>${esc(it.paciente||'')}</td>
        <td>${esc(it.convenio||'')}</td>
        <td>${esc(it.hospital||'')}</td>
        <td class="num">${money(it.valorApresentado)}</td>
        <td class="num" style="color:var(--green)">${money(it.valorPago)}</td>
        <td class="num" style="color:${(+it.glosa||0)>0?'var(--red)':'var(--muted)'}">${(+it.glosa||0)>0?money(it.glosa):'—'}</td>
        <td>${fmtDate(it.dataPagamento)}</td>
        <td>${m?'<span class="badge b-green">✓ corresponde</span>':'<span class="badge b-gray">—</span>'}</td>
      </tr>`;
    }).join('')}
  </tbody></table></div>
  <div class="hint-txt" style="margin-top:8px">Apenas as linhas “✓ corresponde” serão aplicadas (valor pago, data e — se vazio — valor apresentado como previsto).</div>`;
}
function aplicarConciliacao(r){
  let n=0;
  (r.itens||[]).forEach(it=>{
    const p=conciliacaoMatch(it); if(!p) return;
    if(it.valorPago!=null) p.valorPago=+it.valorPago||0;
    if(it.dataPagamento) p.dataPagamento=it.dataPagamento;
    if(!(+p.valorPrevisto||0) && (+it.valorApresentado||0)) p.valorPrevisto=+it.valorApresentado||0;
    n++;
  });
  if(n) save();
  return n;
}

function saveCirurgia(){
  syncCirDraft();
  const d=draft;
  d.paciente = acronimoNome(d.paciente);   // minimização: só iniciais são gravadas
  const fail=(tab,msg)=>{ d._tab=tab; renderCirModal(); toast(msg); };
  if(!(d.paciente||'').trim()) return fail(1,'Informe a identificação do paciente');
  if(!d.convenioId) return fail(1,'Selecione o convênio');
  if(!d.hospitalId) return fail(1,'Selecione o hospital');
  if(!d.dataCirurgia) return fail(1,'Informe a data da cirurgia');
  const procs=d.procs.filter(p=>p.codigo);
  if(!procs.length) return fail(2,'Adicione ao menos um procedimento');

  if(d.id){
    const c=cirOf(d.id);
    Object.assign(c,{paciente:d.paciente,prontuario:d.prontuario||'',convenioId:d.convenioId,hospitalId:d.hospitalId,dataSolicitacao:d.dataSolicitacao,dataCirurgia:d.dataCirurgia,carater:d.carater,papel:d.papel,obs:d.obs});
    DB.procedimentos=DB.procedimentos.filter(p=>p.cirurgiaId!==d.id);
  } else {
    d.id=uid('cir');
    DB.cirurgias.push({id:d.id,medicoId:M(),paciente:d.paciente,prontuario:d.prontuario||'',convenioId:d.convenioId,hospitalId:d.hospitalId,dataSolicitacao:d.dataSolicitacao,dataCirurgia:d.dataCirurgia,carater:d.carater,papel:d.papel,obs:d.obs});
  }
  procs.forEach(p=>{
    DB.procedimentos.push({
      id:uid('prc'),cirurgiaId:d.id,codigo:p.codigo,nome:p.nome,porte:p.porte,qtd:+p.qtd||1,
      statusPlano:p.statusPlano,statusAuditoria:p.statusAuditoria,
      motivoRecusa:p.statusAuditoria==='Recusado'?(p.motivoRecusa||''):'',
      valorPrevisto:+p.valorPrevisto||0,valorPago:+p.valorPago||0,dataPagamento:p.dataPagamento||''
    });
  });
  save(); $('#modal-root').innerHTML=''; toast('Cirurgia salva'); render();
}

function viewPagamentos(){
  const root=$('#viewRoot');
  const f=state.filters.pg=Object.assign({local:'',pac:'',proc:'',de:'',ate:'',status:'aberto',aging:''}, state.filters.pg||{});
  // procedimentos recusados pelo plano não entram em pagamentos (não foram aprovados antes da cirurgia)
  const all=myProcs().map(p=>({p,c:cirOf(p.cirurgiaId)})).filter(x=>x.c && x.p.statusPlano!=='Recusado');
  const pacientes=[...new Set(myCirurgias().map(c=>c.paciente).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const procNames=[...new Set(all.map(({p})=>p.nome).filter(Boolean))].sort((a,b)=>a.localeCompare(b));

  const ci=s=>String(s||'').toLowerCase();
  const baseFilter=({p,c})=>{
    if(f.local){ const q=ci(f.local); if(!ci(hospName(c.hospitalId)).includes(q) && !ci(convName(c.convenioId)).includes(q)) return false; }
    if(f.pac && !ci(c.paciente).includes(ci(f.pac))) return false;
    if(f.proc){
      const q=ci(f.proc), qd=String(f.proc).replace(/\D/g,'');
      const byName=ci(p.nome).includes(q);
      const byCombo=ci(fmtCbhpm(p.codigo)+' — '+p.nome).includes(q);
      const byCode=qd && String(p.codigo).replace(/\D/g,'').includes(qd);
      if(!byName && !byCombo && !byCode) return false;
    }
    if(f.de && (c.dataCirurgia||'') < f.de) return false;
    if(f.ate && (c.dataCirurgia||'') > f.ate) return false;
    return true;
  };
  const statusFilter=({p})=>{
    const s=situacao(p);
    if(f.status==='aberto') return s==='A receber';
    if(f.status==='pago') return s==='Pago'||s==='Glosa parcial';
    if(f.status==='glosa') return s==='Glosa parcial'||s==='Glosado';
    return true;
  };
  const applyFilters=()=>all.filter(x=>baseFilter(x)&&statusFilter(x))
    .sort((a,b)=>(a.c.dataCirurgia||'').localeCompare(b.c.dataCirurgia||''));

  const agingOf = c => daysSince(c.dataCirurgia)<=90 ? 'ate90' : 'mais90';
  const sumSaldo = arr => arr.reduce((s,x)=>s+saldoAberto(x.p),0);

  const cardActive = key => {
    if(key==='receb') return f.status==='pago' && !f.aging;
    if(key==='glosa') return f.status==='glosa' && !f.aging;
    if(key==='total') return f.status==='aberto' && !f.aging;
    return f.status==='aberto' && f.aging===key;   // ate90 / mais90
  };
  const cardClick = key => {
    if(cardActive(key)) { f.status='aberto'; f.aging=''; }
    else if(key==='receb') { f.status='pago'; f.aging=''; }
    else if(key==='glosa') { f.status='glosa'; f.aging=''; }
    else if(key==='total') { f.status='aberto'; f.aging=''; }
    else { f.status='aberto'; f.aging=key; }
    const sel=$('#pgst'); if(sel) sel.value=f.status;
    paint();
  };
  const kpisHtml = () => {
    const cb = all.filter(baseFilter);
    const receb = cb.filter(x=>['Pago','Glosa parcial'].includes(situacao(x.p)));
    const glosa = cb.filter(x=>['Glosa parcial','Glosado'].includes(situacao(x.p)));
    const open  = cb.filter(x=>saldoAberto(x.p)>0);
    const rec90 = open.filter(x=>agingOf(x.c)==='ate90');
    const old90 = open.filter(x=>agingOf(x.c)==='mais90');
    const sumPago  = arr=>arr.reduce((s,x)=>s+(+x.p.valorPago||0),0);
    const sumGlosa = arr=>arr.reduce((s,x)=>s+glosaDe(x.p),0);
    const card = (key,color,label,val,n) => {
      const on = cardActive(key);
      return `<div class="kpi klick" data-card="${key}" style="border-left:4px solid ${color}${on?`;box-shadow:inset 0 0 0 2px ${color}`:''}">
        <div class="label">${label}</div><div class="value">${money0(val)}</div><div class="hint">${n} procedimento(s)</div></div>`;
    };
    return `<div class="kpi-row">
      ${card('receb','#15803d','Recebido', sumPago(receb), receb.length)}
      ${card('total','#eab308','A receber — total', sumSaldo(open), open.length)}
      ${card('ate90','#f59e0b','A receber — até 90 dias', sumSaldo(rec90), rec90.length)}
      ${card('mais90','#b45309','A receber — acima de 90 dias', sumSaldo(old90), old90.length)}
      ${card('glosa','#b91c1c','Glosa', sumGlosa(glosa), glosa.length)}
    </div>`;
  };

  root.innerHTML=`
    <div class="page-head">
      <div><h1>Pagamentos</h1><p>Dê baixa nos recebimentos e registre glosas</p></div>
      <button class="btn btn-primary" style="width:auto" id="concBtn">📄 Documento de conciliação</button>
    </div>
    <div id="pgCards"></div>
    <div class="toolbar">
      <input class="search" id="pglocal" list="dlLocalPg" placeholder="Convênio ou hospital..." value="${esc(f.local)}">
      <input class="search" id="pgpac" list="dlPacPg" placeholder="Paciente..." value="${esc(f.pac)}">
      <input class="search" id="pgproc" list="dlProcPg" placeholder="Código ou nome do procedimento..." value="${esc(f.proc)}">
      <select id="pgst">
        <option value="aberto" ${f.status==='aberto'?'selected':''}>A receber</option>
        <option value="pago" ${f.status==='pago'?'selected':''}>Recebidos</option>
        <option value="glosa" ${f.status==='glosa'?'selected':''}>Glosados</option>
        <option value="todos" ${f.status==='todos'?'selected':''}>Todos</option>
      </select>
      <span class="flt-range">Cirurgia de <input type="date" id="pgde" value="${f.de||''}"> até <input type="date" id="pgate" value="${f.ate||''}"></span>
      <button class="btn btn-sm btn-ghost" id="pgclear">Limpar</button>
    </div>
    <datalist id="dlLocalPg">${localOptions().map(p=>`<option value="${esc(p)}"></option>`).join('')}</datalist>
    <datalist id="dlPacPg">${pacientes.map(p=>`<option value="${esc(p)}"></option>`).join('')}</datalist>
    <datalist id="dlProcPg">${procNames.map(p=>`<option value="${esc(p)}"></option>`).join('')}</datalist>
    <div id="pgListWrap"></div>`;

  const paint=()=>{
    const base=applyFilters();
    const procs = f.aging ? base.filter(x=>agingOf(x.c)===f.aging) : base;
    $('#pgCards').innerHTML=kpisHtml();
    $$('#pgCards [data-card]').forEach(el=>el.onclick=()=>cardClick(el.dataset.card));
    $('#pgListWrap').innerHTML=`
    <div class="card"><div class="card-body flush"><div class="t-wrap">
    ${procs.length?`<table><thead><tr>
      <th>Data cir.</th><th>Dias</th><th>Paciente</th><th>Convênio</th><th>Hospital</th><th>Procedimento</th>
      <th class="num">Previsto</th><th class="num">Pago</th><th>Situação</th><th></th>
    </tr></thead><tbody>
      ${procs.map(({p,c})=>{const s=situacao(p);const d=daysSince(c.dataCirurgia);return `<tr>
        <td>${fmtDate(c.dataCirurgia)}</td>
        <td><span class="badge ${d>90?'b-red':d>60?'b-amber':'b-gray'}">${d}d</span></td>
        <td><b>${esc(c.paciente)}</b></td>
        <td>${esc(convName(c.convenioId))}</td>
        <td>${esc(hospName(c.hospitalId))}</td>
        <td><span style="font-variant-numeric:tabular-nums;color:var(--muted)">${fmtCbhpm(p.codigo)}</span><br>${esc(p.nome)}</td>
        <td class="num">${money(p.valorPrevisto)}</td>
        <td class="num" style="color:var(--green)">${p.valorPago?money(p.valorPago):'—'}</td>
        <td><span class="badge ${SIT_BADGE[s]}">${s}</span>${p.dataPagamento?`<div class="hint-txt">${fmtDate(p.dataPagamento)}</div>`:''}${p.statusAuditoria==='Recusado'&&p.motivoRecusa?`<div class="hint-txt" style="color:var(--red)">Recusa: ${esc(p.motivoRecusa)}</div>`:''}</td>
        <td class="num"><button class="btn btn-sm" data-baixa="${p.id}">${p.dataPagamento?'Editar':'Dar baixa'}</button></td>
      </tr>`;}).join('')}
    </tbody></table>`:emptyState('Nada por aqui','Nenhum procedimento nesta situação / filtro.')}
    </div></div></div>`;
    $$('#pgListWrap [data-baixa]').forEach(b=>b.onclick=()=>openBaixa(b.dataset.baixa));
  };

  $('#concBtn').onclick=openConciliacao;
  const upd=(id,key,ev='input')=>{ const el=$('#'+id); el.addEventListener(ev,()=>{ f[key]=el.value; paint(); }); };
  upd('pglocal','local'); upd('pgpac','pac'); upd('pgproc','proc');
  upd('pgst','status','change'); upd('pgde','de','change'); upd('pgate','ate','change');
  $('#pgclear').onclick=()=>{ Object.assign(f,{local:'',pac:'',proc:'',de:'',ate:'',status:'aberto',aging:''}); viewPagamentos(); };
  paint();
}

    save(); close(); toast('Baixa registrada'); render();

/* ============================================================
   VIEW: RECEBÍVEIS (AGING)
   ============================================================ */
const REC_GROUPS = [
  {k:'conv', label:'Convênio',     keyOf:x=>x.c.convenioId,  nameOf:id=>convName(id)},
  {k:'hosp', label:'Hospital',     keyOf:x=>x.c.hospitalId,  nameOf:id=>hospName(id)},
  {k:'proc', label:'Procedimento', keyOf:x=>x.p.codigo||'—', nameOf:code=>{const r=CBHPM_BY_CODE[code]; return r?`${fmtCbhpm(code)} — ${r.nome}`:(code||'—');}},
];
function viewRecebiveis(){
  const root=$('#viewRoot');
  const f = state.filters.rec = Object.assign({bucket:'', group:'conv'}, state.filters.rec||{});
  const openAll = myProcs().map(p=>({p,c:cirOf(p.cirurgiaId)})).filter(x=>x.c && saldoAberto(x.p)>0);
  const coarse = c => { const d=daysSince(c.dataCirurgia); return d<=60?'0-60':d<=120?'61-120':'+120'; };
  const sumSaldo = arr => arr.reduce((s,x)=>s+saldoAberto(x.p),0);

  root.innerHTML=`
    <div class="page-head"><div><h1>Recebíveis (aging)</h1><p>Valor a receber por faixa de tempo desde a <b>data da cirurgia</b></p></div></div>
    <div id="recBody"></div>`;

  const paint = () => {
    const b060  = openAll.filter(x=>coarse(x.c)==='0-60');
    const b120  = openAll.filter(x=>coarse(x.c)==='61-120');
    const bMais = openAll.filter(x=>coarse(x.c)==='+120');
    const rows  = f.bucket ? openAll.filter(x=>coarse(x.c)===f.bucket) : openAll.slice();

    const bcard = (key,color,label,arr) => {
      const on = key==='total' ? !f.bucket : f.bucket===key;
      return `<div class="kpi klick" data-bucket="${key}" style="border-left:4px solid ${color}${on?`;box-shadow:inset 0 0 0 2px ${color}`:''}">
        <div class="label">${label}</div><div class="value">${money0(sumSaldo(arr))}</div><div class="hint">${arr.length} procedimento(s)</div></div>`;
    };
    const gcard = x => `<div class="kpi klick" data-group="${x.k}" style="${f.group===x.k?'box-shadow:inset 0 0 0 2px var(--accent);':''}">
      <div class="label">Detalhar lista por</div><div class="value" style="font-size:16px">${x.label}</div></div>`;

    const g = REC_GROUPS.find(x=>x.k===f.group) || REC_GROUPS[0];
    const map={};
    rows.forEach(x=>{ const k=g.keyOf(x); const bkt=bucketOf(x.c.dataCirurgia);
      (map[k]=map[k]||Object.fromEntries(BUCKETS.map(z=>[z,0])))[bkt]+=saldoAberto(x.p); });
    const gkeys=Object.keys(map).sort((a,b)=>rowTot(map[b])-rowTot(map[a]));
    const gtot=sumSaldo(rows);
    const breakdown = gkeys.length ? `<div class="t-wrap"><table><thead><tr><th>${g.label}</th>${BUCKETS.map(z=>`<th class="num">${z} dias</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>
        ${gkeys.map(k=>`<tr><td><b>${esc(g.nameOf(k))}</b></td>${BUCKETS.map(z=>`<td class="num">${map[k][z]?money0(map[k][z]):'<span style="color:var(--border)">—</span>'}</td>`).join('')}<td class="num" style="font-weight:700">${money0(rowTot(map[k]))}</td></tr>`).join('')}
        <tr style="background:var(--surface-2)"><td style="font-weight:700">Total</td>${BUCKETS.map(z=>`<td class="num" style="font-weight:700">${money0(gkeys.reduce((s,k)=>s+map[k][z],0))}</td>`).join('')}<td class="num" style="font-weight:700">${money0(gtot)}</td></tr>

        ${rows.map(({p,c})=>{const d=daysSince(c.dataCirurgia);return `<tr class="row-click" data-cir="${c.id}"><td>${fmtDate(c.dataCirurgia)}</td><td><span class="badge ${d>90?'b-red':d>60?'b-amber':'b-gray'}">${d}d</span></td><td>${bucketOf(c.dataCirurgia)}</td><td><b>${esc(c.paciente)}</b></td><td>${esc(convName(c.convenioId))}</td><td>${esc(hospName(c.hospitalId))}</td><td>${esc(p.nome)}</td><td class="num">${money(saldoAberto(p))}</td></tr>`;}).join('')}
      </tbody></table>` : emptyState('Nenhum recebível em aberto','Tudo em dia! 🎉');

    $('#recBody').innerHTML = `
      <div class="kpi-row">
        ${bcard('total','#0f766e','Total a receber', openAll)}
        ${bcard('0-60','#15803d','Recente · 0–60 dias', b060)}
        ${bcard('61-120','#b45309','61–120 dias', b120)}
        ${bcard('+120','#b91c1c','Vencido · +120 dias', bMais)}
      </div>
      <div class="kpi-row">${REC_GROUPS.map(gcard).join('')}</div>
      <div class="card"><div class="card-head"><h3>Aging por ${g.label.toLowerCase()}</h3></div><div class="card-body flush">${breakdown}</div></div>
      <div class="card"><div class="card-head"><h3>Procedimentos em aberto (${rows.length})</h3></div><div class="card-body flush"><div class="t-wrap">${detail}</div></div></div>`;

    $$('#recBody [data-bucket]').forEach(el=>el.onclick=()=>{ const k=el.dataset.bucket; f.bucket = k==='total'?'':(f.bucket===k?'':k); paint(); });
    $$('#recBody [data-group]').forEach(el=>el.onclick=()=>{ f.group=el.dataset.group; paint(); });
    $$('#recBody [data-cir]').forEach(tr=>tr.onclick=()=>openCirurgia(tr.dataset.cir));
  };
  paint();
}
function rowTot(o){ return Object.values(o).reduce((a,b)=>a+b,0); }
