function diffDays(a,b){ if(!a||!b) return 0; return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function hbars(rows, fmt, colorFn){
  if(!rows.length) return `<div class="hint-txt" style="padding:8px 2px">Sem dados no período.</div>`;
  const max=Math.max(1,...rows.map(r=>r.value));
  return `<div class="hbars">${rows.map(r=>{
    const col=(colorFn&&colorFn(r))||r.color||'var(--accent)';
    return `<div class="hbar">
      <div class="hbar-lbl">${esc(r.label)}${r.sub?`<span class="hbar-sub">${esc(r.sub)}</span>`:''}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${Math.max(2,r.value/max*100)}%;background:${col}"></div></div>
      <div class="hbar-val">${fmt?fmt(r.value):r.value}</div>
    </div>`;
  }).join('')}</div>`;
}
const MES_ABREV=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function lastNMonths(n){
  const out=[], d=new Date();
  for(let i=n-1;i>=0;i--){ const dt=new Date(d.getFullYear(), d.getMonth()-i, 1);
    out.push({ ym:`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`, label:`${MES_ABREV[dt.getMonth()]}/${String(dt.getFullYear()).slice(2)}` });
  }
  return out;
}
function monthlyChartSVG(rows){
  if(!rows.some(r=>r.previsto>0||r.cir>0)) return '<div class="empty" style="padding:24px">Sem cirurgias nos últimos 12 meses.</div>';
  const W=760,H=240,padL=6,padR=6,padT=24,padB=32;
  const plotH=H-padT-padB, plotW=W-padL-padR, slot=plotW/rows.length;
  const bw=Math.min(40,slot*0.56);
  const maxV=Math.max(1,...rows.map(r=>r.recebido+r.aberto+r.glosa));
  const grid=[0,.25,.5,.75,1].map(t=>{
    const yy=padT+plotH-t*plotH;
    return `<line x1="${padL}" x2="${W-padR}" y1="${yy}" y2="${yy}" stroke="#e3e8ee" stroke-width="1"/>`+
      (t>0?`<text x="${W-padR}" y="${yy-3}" text-anchor="end" font-size="9" fill="#64748b">${money0(maxV*t)}</text>`:'');
  }).join('');
  const bars=rows.map((r,i)=>{
    const x=padL+i*slot+(slot-bw)/2;
    let acc=0,seg='';
    [['recebido','#15803d'],['aberto','#b45309'],['glosa','#b91c1c']].forEach(([k,col])=>{
      const val=r[k]||0; if(val<=0) return;
      const h=val/maxV*plotH, yy=padT+plotH-acc-h;
      seg+=`<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,h-2).toFixed(1)}" rx="1.5" fill="${col}"><title>${esc(r.label)} · ${k}: ${money(val)}</title></rect>`;
      acc+=h;
    });
    const tot=r.recebido+r.aberto+r.glosa;
    return seg+
      `<text x="${(x+bw/2).toFixed(1)}" y="${(padT+plotH-acc-6).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1c2733">${r.cir||''}</text>`+
      `<text x="${(x+bw/2).toFixed(1)}" y="${H-padB+13}" text-anchor="middle" font-size="9" fill="#64748b">${r.label}</text>`;
  }).join('');
  return `<div class="t-wrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:560px;height:auto;display:block">
    <text x="${padL}" y="12" font-size="9.5" fill="#64748b">altura = recebido + a receber + glosa · número acima = nº de cirurgias no mês</text>
    ${grid}${bars}
  </svg></div>`;
}

function viewResumo(){
  const root=$('#viewRoot');
  const d=new Date();
  let range = { de:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`,
                ate:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(new Date(d.getFullYear(),d.getMonth()+1,0).getDate()).padStart(2,'0')}` };

  const psAll = myProcs().map(p=>({p,c:cirOf(p.cirurgiaId)})).filter(x=>x.c);
  const cirAll = myCirurgias();

  // ---- gráfico mensal fixo (12 meses, independente do filtro) ----
  const monthly = lastNMonths(12).map(mo=>{
    const rows=psAll.filter(x=>(x.c.dataCirurgia||'').slice(0,7)===mo.ym);
    const cs=new Set(rows.map(x=>x.c.id));
    return { ...mo, cir:cs.size,
      previsto: rows.reduce((s,x)=>s+(+x.p.valorPrevisto||0),0),
      recebido: rows.reduce((s,x)=>s+(+x.p.valorPago||0),0),
      aberto:   rows.reduce((s,x)=>s+saldoAberto(x.p),0),
      glosa:    rows.reduce((s,x)=>s+glosaDe(x.p),0) };
  });

  root.innerHTML=`
    <div class="page-head"><div><h1>Resumo executivo</h1><p>Indicadores gerenciais de faturamento, recebimento e glosa</p></div></div>
    <div class="toolbar">
      <span class="rng">Período (data da cirurgia) de <input type="date" id="rDe"> até <input type="date" id="rAte"></span>
      <button class="btn btn-sm" data-preset="0">Mês atual</button>
      <button class="btn btn-sm" data-preset="2">3 meses</button>
      <button class="btn btn-sm" data-preset="11">12 meses</button>
      <button class="btn btn-sm" data-preset="all">Tudo</button>
    </div>
    <div class="card"><div class="card-head"><h3>Evolução mensal — últimos 12 meses</h3></div><div class="card-body">
      ${monthlyChartSVG(monthly)}
      <div class="mlegend"><span><i style="background:#15803d"></i>Recebido</span><span><i style="background:#b45309"></i>A receber</span><span><i style="background:#b91c1c"></i>Glosa</span></div>
    </div></div>
    <div id="resBody"></div>`;

  const nameConv = k => convName(k);
  const nameHosp = k => hospName(k);
  const nameProc = k => { const r=CBHPM_BY_CODE[k]; return r ? `${fmtCbhpm(k)} — ${r.nome}` : (k||'—'); };

  const paint = () => {
    $('#rDe').value=range.de; $('#rAte').value=range.ate;
    const inRange = c => (!range.de || (c.dataCirurgia||'')>=range.de) && (!range.ate || (c.dataCirurgia||'')<=range.ate);
    const S = psAll.filter(x=>inRange(x.c));
    const cirN = new Set(S.map(x=>x.c.id)).size;
    const prev=S.reduce((s,x)=>s+(+x.p.valorPrevisto||0),0);
    const pago=S.reduce((s,x)=>s+(+x.p.valorPago||0),0);
    const aberto=S.reduce((s,x)=>s+saldoAberto(x.p),0);
    const glosa=S.reduce((s,x)=>s+glosaDe(x.p),0);
    const taxa = prev? pago/prev*100 : 0;

    // prazo médio de pagamento (cirurgia → pagamento) p/ procedimentos efetivamente recebidos
    const paidRows = S.filter(x=>x.p.dataPagamento && (+x.p.valorPago||0)>0);
    const prazoBy = keyFn => {
      const m={}; paidRows.forEach(x=>{ const k=keyFn(x); (m[k]=m[k]||{sum:0,n:0}); m[k].sum+=diffDays(x.c.dataCirurgia,x.p.dataPagamento); m[k].n++; });
      return m;
    };
    const prazoRows = (m,nameFn) => Object.entries(m).map(([k,o])=>({label:nameFn(k),value:Math.round(o.sum/o.n),sub:`${o.n} pgto(s)`})).sort((a,b)=>b.value-a.value);
    const prazoGlobal = paidRows.length ? Math.round(paidRows.reduce((s,x)=>s+diffDays(x.c.dataCirurgia,x.p.dataPagamento),0)/paidRows.length) : 0;

    // aderência ao CBHPM: pago / previsto sobre procedimentos com pagamento registrado
    const settled = S.filter(x=>x.p.dataPagamento);
    const aderRows = (keyFn,nameFn) => {
      const m={}; settled.forEach(x=>{ const k=keyFn(x); (m[k]=m[k]||{pago:0,prev:0}); m[k].pago+=+x.p.valorPago||0; m[k].prev+=+x.p.valorPrevisto||0; });
      return Object.entries(m).filter(([,o])=>o.prev>0)
        .map(([k,o])=>({label:nameFn(k), value:Math.round(o.pago/o.prev*100), sub:`${money0(o.pago)} de ${money0(o.prev)}`}))
        .sort((a,b)=>a.value-b.value);
    };
    const aderColor = r => r.value>=95?'#15803d':r.value>=85?'#b45309':'#b91c1c';

    // procedimentos mais glosados + motivo dominante
    const glProc={};
    S.forEach(x=>{ const g=glosaDe(x.p); if(g<=0) return; const k=x.p.codigo||'—';
      (glProc[k]=glProc[k]||{v:0,n:0,mot:{}}); glProc[k].v+=g; glProc[k].n++;
      if(x.p.motivoRecusa) glProc[k].mot[x.p.motivoRecusa]=(glProc[k].mot[x.p.motivoRecusa]||0)+1; });
    const glProcRows = Object.entries(glProc).map(([k,o])=>{
      const tm=Object.entries(o.mot).sort((a,b)=>b[1]-a[1])[0];
      return {label:nameProc(k), value:o.v, sub:`${o.n}× ${tm?'· '+tm[0]:''}`, color:'#b91c1c'};
    }).sort((a,b)=>b.value-a.value).slice(0,8);

    // glosa da auditoria por motivo
    const glMot={};
    S.forEach(x=>{ if(x.p.statusAuditoria!=='Recusado') return; const k=x.p.motivoRecusa||'(motivo não informado)';
      (glMot[k]=glMot[k]||{v:0,n:0}); glMot[k].v+=(+x.p.valorPrevisto||0); glMot[k].n++; });
    const glMotRows=Object.entries(glMot).map(([k,o])=>({label:k,value:o.v,sub:`${o.n}×`,color:'#b45309'})).sort((a,b)=>b.value-a.value);

    // plano que mais recusou + hospital
    const recP={};
    S.forEach(x=>{ if(x.p.statusPlano!=='Recusado' && x.p.statusAuditoria!=='Recusado') return;
      const k=x.c.convenioId; (recP[k]=recP[k]||{n:0,h:{}}); recP[k].n++; recP[k].h[x.c.hospitalId]=(recP[k].h[x.c.hospitalId]||0)+1; });
    const recPRows=Object.entries(recP).map(([k,o])=>{
      const th=Object.entries(o.h).sort((a,b)=>b[1]-a[1])[0];
      return {label:convName(k), value:o.n, sub: th?`+ recusas: ${hospName(th[0])} (${th[1]})`:'', color:'#b91c1c'};
    }).sort((a,b)=>b.value-a.value);

    // ---- insights executivos ----
    const ins=[];
    const pc=prazoRows(prazoBy(x=>x.c.convenioId),nameConv)[0];
    if(pc) ins.push(`<b>${esc(pc.label)}</b> é o convênio que mais demora a pagar: <b>${pc.value} dias</b> em média (média geral ${prazoGlobal} dias).`);
    const ph=prazoRows(prazoBy(x=>x.c.hospitalId),nameHosp)[0];
    if(ph && (!pc || ph.value>pc.value)) ins.push(`Pelo hospital, <b>${esc(ph.label)}</b> puxa o prazo para <b>${ph.value} dias</b>.`);
    const ac=aderRows(x=>x.c.convenioId,nameConv)[0];
    if(ac && ac.value<100) ins.push(`<b>${esc(ac.label)}</b> paga <b>${ac.value}%</b> do previsto pela CBHPM — ${100-ac.value}% abaixo (${ac.sub}).`);
    if(glProcRows[0]) ins.push(`Procedimento mais glosado: <b>${esc(glProcRows[0].label)}</b> — ${money0(glProcRows[0].value)}.`);
    if(recPRows[0]) ins.push(`<b>${esc(recPRows[0].label)}</b> lidera recusas: <b>${recPRows[0].value}</b> procedimento(s) ${recPRows[0].sub}.`);
    ins.push(`Recebimento no período: <b>${taxa.toFixed(0)}%</b> do previsto (${money0(pago)} de ${money0(prev)}); a receber ${money0(aberto)}.`);

    $('#resBody').innerHTML=`
      <div class="insights"><h3>Principais insights</h3><ul>${ins.map(t=>`<li>${t}</li>`).join('')}</ul></div>
      <div class="kpi-row">
        <div class="kpi"><div class="label">Cirurgias no período</div><div class="value">${cirN}</div><div class="hint">${S.length} procedimentos</div></div>
        <div class="kpi accent"><div class="label">Faturamento previsto</div><div class="value">${money0(prev)}</div></div>
        <div class="kpi green"><div class="label">Recebido</div><div class="value">${money0(pago)}</div><div class="hint">${taxa.toFixed(0)}% do previsto</div></div>
        <div class="kpi amber"><div class="label">A receber</div><div class="value">${money0(aberto)}</div></div>
        <div class="kpi red"><div class="label">Glosa</div><div class="value">${money0(glosa)}</div></div>
        <div class="kpi"><div class="label">Prazo médio de pagamento</div><div class="value">${prazoGlobal}<span style="font-size:14px"> dias</span></div><div class="hint">${paidRows.length} pagamento(s)</div></div>
      </div>

      <div class="sec-grid">
        <div class="card"><div class="card-head"><h3>Prazo médio de pagamento — por convênio</h3><span class="hint-txt">dias desde a cirurgia</span></div><div class="card-body">${hbars(prazoRows(prazoBy(x=>x.c.convenioId),nameConv), v=>v+' d', ()=>'#1d4ed8')}</div></div>
        <div class="card"><div class="card-head"><h3>Prazo médio de pagamento — por hospital</h3></div><div class="card-body">${hbars(prazoRows(prazoBy(x=>x.c.hospitalId),nameHosp), v=>v+' d', ()=>'#1d4ed8')}</div></div>
      </div>

      <div class="sec-grid">
        <div class="card"><div class="card-head"><h3>Aderência à CBHPM — por convênio</h3><span class="hint-txt">% pago vs. previsto</span></div><div class="card-body">${hbars(aderRows(x=>x.c.convenioId,nameConv), v=>v+'%', aderColor)}</div></div>
        <div class="card"><div class="card-head"><h3>Aderência à CBHPM — por hospital</h3></div><div class="card-body">${hbars(aderRows(x=>x.c.hospitalId,nameHosp), v=>v+'%', aderColor)}</div></div>
      </div>

      <div class="card"><div class="card-head"><h3>Procedimentos mais glosados</h3><span class="hint-txt">valor glosado · motivo dominante</span></div><div class="card-body">${hbars(glProcRows, money0)}</div></div>

      <div class="sec-grid">
        <div class="card"><div class="card-head"><h3>Glosa da auditoria por motivo</h3><span class="hint-txt">valor previsto recusado</span></div><div class="card-body">${hbars(glMotRows, money0)}</div></div>
        <div class="card"><div class="card-head"><h3>Recusas por convênio</h3><span class="hint-txt">plano + hospital onde mais recusa</span></div><div class="card-body">${hbars(recPRows, v=>v)}</div></div>
      </div>`;
  };

  $$('#viewRoot [data-preset]').forEach(b=>b.onclick=()=>{
    const p=b.dataset.preset;
    if(p==='all'){ range={de:'',ate:''}; }
    else { const back=+p; const s=new Date(d.getFullYear(), d.getMonth()-back, 1); const e=new Date(d.getFullYear(), d.getMonth()+1, 0);
      range={ de:`${s.getFullYear()}-${String(s.getMonth()+1).padStart(2,'0')}-01`, ate:`${e.getFullYear()}-${String(e.getMonth()+1).padStart(2,'0')}-${String(e.getDate()).padStart(2,'0')}` }; }
    paint();
  });
  $('#rDe').onchange=e=>{ range.de=e.target.value; paint(); };
  $('#rAte').onchange=e=>{ range.ate=e.target.value; paint(); };
  paint();
}

const CONV_CARD_COLORS = ['#0f766e','#4f46e5','#b45309','#be123c','#0369a1','#7c3aed','#15803d','#c2410c','#0891b2','#9333ea','#ca8a04','#1d4ed8','#db2777','#4d7c0f'];

function viewConvenios(){
  const root=$('#viewRoot');
  const convs=myConvenios();
  const cirById={}; myCirurgias().forEach(c=>cirById[c.id]=c);
  const allOpen=myProcs().filter(p=>saldoAberto(p)>0).map(p=>{
    const c=cirById[p.cirurgiaId]||{};
    return {convId:c.convenioId, d:daysSince(c.dataCirurgia), v:saldoAberto(p)};
  });

  const cardHtml=(cv,i)=>{
    const col=CONV_CARD_COLORS[i%CONV_CARD_COLORS.length];
    const nHosp=(cv.hospitalIds||[]).length;
    const open=allOpen.filter(x=>x.convId===cv.id);
    const rec=open.filter(x=>x.d<=90), old=open.filter(x=>x.d>90);
    const sum=arr=>arr.reduce((s,x)=>s+x.v,0);
    const metric=(label,color,n,v)=>`
      <div class="cc-metric">
        <div class="mbar" style="background:${color}"></div>
        <div class="mtxt">
          <div class="mlabel">${label}</div>
          <div class="mval"><span class="mn">${n}</span><span class="mv">${money(v)}</span></div>
        </div>
      </div>`;
    return `<div class="conv-card" data-ed="${cv.id}" style="--cc:${col}">
      <div class="cc-head">
        <div class="cc-name">${esc(cv.nome)}</div>
        <div class="cc-sub">${nHosp} ${nHosp===1?'hospital':'hospitais'}</div>
        <div class="cc-edit">✎ Editar</div>
      </div>
      <div class="cc-metrics">
        ${metric('Procedimentos a receber total','#eab308',open.length,sum(open))}
        ${metric('Procedimentos a receber 0 a 90 dias','#f59e0b',rec.length,sum(rec))}
        ${metric('Procedimentos a receber + de 90 dias','#b91c1c',old.length,sum(old))}
      </div>
    </div>`;
  };

  const f=state.filters.convList=state.filters.convList||{q:''};
  const matchQ=(cv,q)=>{
    if(!q) return true;
    if(cv.nome.toLowerCase().includes(q)) return true;
    return (cv.hospitalIds||[]).map(hospName).join(' ').toLowerCase().includes(q);
  };

  root.innerHTML=`
    <div class="page-head"><div><h1>Convênios</h1><p>${convs.length} convênio(s) · procedimentos a receber por faixa de tempo desde a cirurgia</p></div>
      <button class="btn btn-primary" style="width:auto" id="novo">+ Novo convênio</button></div>
    <div class="toolbar"><input class="search" id="cvq" style="min-width:300px" placeholder="Buscar por convênio ou hospital..." value="${esc(f.q)}"></div>
    <div id="convListWrap"></div>`;

  const paint=()=>{
    const q=f.q.trim().toLowerCase();
    const list=convs.filter(cv=>matchQ(cv,q));
    $('#convListWrap').innerHTML = list.length
      ? `<div class="conv-grid">${list.map(cv=>cardHtml(cv,convs.indexOf(cv))).join('')}</div>`
      : `<div class="card"><div class="card-body">${emptyState(convs.length?'Nenhum convênio corresponde à busca':'Nenhum convênio cadastrado','')}</div></div>`;
    $$('#convListWrap [data-ed]').forEach(b=>b.onclick=()=>editConvenio(b.dataset.ed));
  };
  $('#cvq').oninput=e=>{ f.q=e.target.value; paint(); };
  $('#novo').onclick=()=>editConvenio(null);

function viewHospitais(){
  const root=$('#viewRoot');
  const hs=myHospitais();
  const convs=myConvenios();
  const cirById={}; myCirurgias().forEach(c=>cirById[c.id]=c);
  const allOpen=myProcs().filter(p=>saldoAberto(p)>0).map(p=>{
    const c=cirById[p.cirurgiaId]||{};
    return {hospId:c.hospitalId, d:daysSince(c.dataCirurgia), v:saldoAberto(p)};
  });

  const cardHtml=(h,i)=>{
    const col=CONV_CARD_COLORS[i%CONV_CARD_COLORS.length];
    const open=allOpen.filter(x=>x.hospId===h.id);
    const rec=open.filter(x=>x.d<=90), old=open.filter(x=>x.d>90);
    const sum=arr=>arr.reduce((s,x)=>s+x.v,0);
    const ligados=convs.filter(cv=>(cv.hospitalIds||[]).includes(h.id));
    const tags = ligados.length
      ? ligados.slice(0,5).map(cv=>`<span class="cc-tag">${esc(cv.nome)}</span>`).join('')
        + (ligados.length>5?`<span class="cc-tag">+${ligados.length-5}</span>`:'')
      : `<span class="cc-tag">nenhum convênio vinculado</span>`;
    const metric=(label,color,n,v)=>`
      <div class="cc-metric">
        <div class="mbar" style="background:${color}"></div>
        <div class="mtxt">
          <div class="mlabel">${label}</div>
          <div class="mval"><span class="mn">${n}</span><span class="mv">${money(v)}</span></div>
        </div>
      </div>`;
    return `<div class="conv-card hosp-card" data-ed="${h.id}" style="--cc:${col}">
      <div class="cc-head">
        <div class="cc-name">${esc(h.nome)}</div>
        <div class="cc-sub">${esc(h.rede||'sem rede')}</div>
        <div class="cc-tags" title="Convênios que atendem neste hospital">${tags}</div>
      </div>
      <div class="cc-metrics">
        ${metric('Procedimentos a receber total','#eab308',open.length,sum(open))}
        ${metric('Procedimentos a receber 0 a 90 dias','#f59e0b',rec.length,sum(rec))}
        ${metric('Procedimentos a receber + de 90 dias','#b91c1c',old.length,sum(old))}
      </div>
    </div>`;
  };

  const f=state.filters.hospList=state.filters.hospList||{q:''};
  const matchQ=(h,q)=>{
    if(!q) return true;
    if(h.nome.toLowerCase().includes(q)) return true;
    if((h.rede||'').toLowerCase().includes(q)) return true;
    return convs.filter(cv=>(cv.hospitalIds||[]).includes(h.id)).map(cv=>cv.nome).join(' ').toLowerCase().includes(q);
  };

  root.innerHTML=`
    <div class="page-head"><div><h1>Hospitais</h1><p>${hs.length} hospital(is) · procedimentos a receber por faixa de tempo desde a cirurgia</p></div>
      <button class="btn btn-primary" style="width:auto" id="novo">+ Novo hospital</button></div>
    <div class="toolbar"><input class="search" id="hqs" style="min-width:300px" placeholder="Buscar por hospital ou convênio..." value="${esc(f.q)}"></div>
    <div id="hospListWrap"></div>`;

  const paint=()=>{
    const q=f.q.trim().toLowerCase();
    const list=hs.filter(h=>matchQ(h,q));
    $('#hospListWrap').innerHTML = list.length
      ? `<div class="conv-grid">${list.map(h=>cardHtml(h,hs.indexOf(h))).join('')}</div>`
      : `<div class="card"><div class="card-body">${emptyState(hs.length?'Nenhum hospital corresponde à busca':'Nenhum hospital cadastrado','')}</div></div>`;
    $$('#hospListWrap [data-ed]').forEach(b=>b.onclick=()=>editHospital(b.dataset.ed));
  };
  $('#hqs').oninput=e=>{ f.q=e.target.value; paint(); };
  $('#novo').onclick=()=>editHospital(null);
  paint();
}
function editHospital(id){
  const h=id?DB.hospitais.find(x=>x.id===id):{id:null,nome:'',rede:''};
  const sel=new Set(id ? myConvenios().filter(cv=>(cv.hospitalIds||[]).includes(id)).map(cv=>cv.id) : []);

  $('#modal-root').innerHTML=`
  <div class="overlay" id="ov"><div class="modal" style="max-width:480px">
    <div class="modal-head"><h3>${id?'Editar hospital':'Novo hospital'}</h3><button class="x-btn" id="mx">&times;</button></div>
    <div class="modal-body">
      <div class="field"><label>Nome do hospital *</label><input id="h-nome" value="${esc(h.nome)}"></div>
      <div class="field"><label>Rede / grupo</label><input id="h-rede" value="${esc(h.rede||'')}" placeholder="Ex.: Rede Cirúrgica, Unimed..."></div>
      <div class="field">
        <label>Convênios que atendem neste hospital</label>
        <div id="cvChips" style="margin-bottom:6px"></div>
        <div class="cbhpm-cell">
          <input id="cvInput" placeholder="Digite para buscar um convênio..." autocomplete="off">
          <div class="cbhpm-drop" id="cvDrop" style="display:none"></div>
        </div>
        <button class="btn btn-sm" id="cvNew" type="button" style="margin-top:8px">+ Novo convênio</button>
      </div>
    </div>
    <div class="modal-foot">
      ${id?`<button class="btn btn-danger" id="del" style="margin-right:auto">Excluir</button>`:''}
      <button class="btn" id="mcancel">Cancelar</button>
      <button class="btn btn-primary" style="width:auto" id="msave">Salvar</button>
    </div>
  </div></div>`;
  const close=()=>$('#modal-root').innerHTML='';
  $('#ov').onclick=e=>{if(e.target.id==='ov')close();};$('#mx').onclick=close;$('#mcancel').onclick=close;

  const input=$('#cvInput'), drop=$('#cvDrop');
  const hideDrop=()=>{ drop.style.display='none'; };
  const paintChips=()=>{
    const chips=[...sel].map(cid=>{
      const cv=DB.convenios.find(c=>c.id===cid); if(!cv) return '';
      return `<span class="chip">${esc(cv.nome)}<button type="button" data-rm="${cid}" style="border:none;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 0 0 3px">&times;</button></span>`;
    }).join('');
    $('#cvChips').innerHTML = chips || `<span class="hint-txt">Nenhum convênio vinculado ainda.</span>`;
    $$('#cvChips [data-rm]').forEach(b=>b.onclick=()=>{ sel.delete(b.dataset.rm); paintChips(); });
  };
  const addConv=cid=>{ sel.add(cid); input.value=''; hideDrop(); paintChips(); input.focus(); };
  const createConv=nome=>{
    nome=(nome||'').trim(); if(!nome) return toast('Digite o nome do convênio');
    let cv=myConvenios().find(c=>c.nome.toLowerCase()===nome.toLowerCase());
    if(!cv){ cv={id:uid('con'),medicoId:M(),nome,hospitalIds:[]}; DB.convenios.push(cv); save(); toast('Convênio “'+nome+'” criado'); }
    addConv(cv.id);
  };
  const showMatches=()=>{
    const q=input.value.trim().toLowerCase();
    const list=myConvenios().filter(cv=>!sel.has(cv.id) && (!q || cv.nome.toLowerCase().includes(q)));
    const exact=myConvenios().some(cv=>cv.nome.toLowerCase()===q);
    let html=list.slice(0,30).map(cv=>`<div class="cbhpm-opt" data-add="${cv.id}">${esc(cv.nome)}</div>`).join('');
    if(q && !exact) html+=`<div class="cbhpm-opt" data-create="1"><span class="code">＋</span> Criar convênio “${esc(input.value.trim())}”</div>`;
    if(!html){ hideDrop(); return; }
    drop.innerHTML=html; drop.style.display='block';
    $$('#cvDrop [data-add]').forEach(o=>o.onmousedown=e=>{ e.preventDefault(); addConv(o.dataset.add); });
    const cr=$('#cvDrop [data-create]');
    if(cr) cr.onmousedown=e=>{ e.preventDefault(); createConv(input.value); };
  };
  input.oninput=showMatches;
  input.onfocus=showMatches;
  input.onblur=()=>setTimeout(hideDrop,150);
  input.onkeydown=e=>{
    if(e.key==='Enter'){ e.preventDefault();
      const q=input.value.trim().toLowerCase();
      const m=myConvenios().find(cv=>cv.nome.toLowerCase()===q && !sel.has(cv.id));
      if(m) addConv(m.id); else if(q) createConv(input.value);
    } else if(e.key==='Escape') hideDrop();
  };
  $('#cvNew').onclick=()=>{ if(input.value.trim()) createConv(input.value); else input.focus(); };
  paintChips();

  if($('#del'))$('#del').onclick=()=>{
    if(myCirurgias().some(c=>c.hospitalId===id)) return toast('Há cirurgias neste hospital — não é possível excluir');
    DB.hospitais=DB.hospitais.filter(x=>x.id!==id);
    DB.convenios.forEach(c=>c.hospitalIds=(c.hospitalIds||[]).filter(x=>x!==id));
    save(); close(); toast('Hospital excluído'); render();
  };
  $('#msave').onclick=()=>{
    const nome=$('#h-nome').value.trim(); if(!nome) return toast('Informe o nome');
    const rede=$('#h-rede').value.trim();
    let hid=id;
    if(id){ const x=DB.hospitais.find(z=>z.id===id); x.nome=nome; x.rede=rede; }
    else { hid=uid('hos'); DB.hospitais.push({id:hid,medicoId:M(),nome,rede}); }
    myConvenios().forEach(cv=>{
      const has=(cv.hospitalIds||[]).includes(hid), want=sel.has(cv.id);
      if(want && !has) cv.hospitalIds=[...(cv.hospitalIds||[]),hid];
      else if(!want && has) cv.hospitalIds=cv.hospitalIds.filter(x=>x!==hid);
    });
    save(); close(); toast('Hospital salvo'); render();
  };
}

   VIEW: VALORES DE REFERÊNCIA (média histórica paga)
   ============================================================ */
function viewReferencia(){
  const root=$('#viewRoot');
  const f=state.filters.ref=state.filters.ref||{q:''};
  const m={};
  myProcs().forEach(p=>{
    if(!((+p.valorPago||0)>0)) return;
    const c=cirOf(p.cirurgiaId); if(!c) return;
    const code=String(p.codigo).replace(/\D/g,'');
    const papel=c.papel||'—';
    const porte=p.porte || (CBHPM_BY_CODE[code]||{}).porte || '—';
    const k=code+'|'+c.convenioId+'|'+papel;
    const o=m[k]=m[k]||{codigo:p.codigo,nome:p.nome,porte,papel,convenioId:c.convenioId,pagos:[],prev:0,ultima:''};
    o.pagos.push(+p.valorPago||0); o.prev+=+p.valorPrevisto||0;
    if((p.dataPagamento||'')>o.ultima) o.ultima=p.dataPagamento||'';
  });
  let rows=Object.values(m).map(o=>{
    const soma=o.pagos.reduce((s,v)=>s+v,0);
    return {...o, n:o.pagos.length, media:soma/o.pagos.length, min:Math.min(...o.pagos), max:Math.max(...o.pagos), taxa:o.prev?soma/o.prev*100:null};
  });
  const q=f.q.trim().toLowerCase();
  if(q) rows=rows.filter(r=>(fmtCbhpm(r.codigo)+' '+r.nome+' '+convName(r.convenioId)+' '+r.papel+' '+r.porte).toLowerCase().includes(q));
  rows.sort((a,b)=> convName(a.convenioId).localeCompare(convName(b.convenioId)) || String(a.papel).localeCompare(String(b.papel)) || (b.media-a.media));

  root.innerHTML=`
    <div class="page-head"><div><h1>Valores de referência</h1><p>Média do que cada convênio efetivamente pagou — por procedimento e <b>papel do médico</b> (cirurgião, auxiliar e anestesista recebem valores distintos). Base da sugestão de valor previsto.</p></div></div>
    <div class="toolbar"><input class="search" id="refq" style="min-width:340px" placeholder="Buscar procedimento, convênio, papel ou porte..." value="${esc(f.q)}"></div>
    <div class="card"><div class="card-body flush"><div class="t-wrap">
    ${rows.length?`<table><thead><tr>
      <th>Procedimento</th><th style="width:52px">Porte</th><th>Papel</th><th>Convênio</th><th class="num">Pagamentos</th><th class="num">Média paga</th><th class="num">Faixa</th><th class="num">Pago vs. previsto</th><th>Último</th>
    </tr></thead><tbody>
      ${rows.map(r=>`<tr>
        <td><span style="font-variant-numeric:tabular-nums;color:var(--muted)">${fmtCbhpm(r.codigo)}</span><br>${esc(r.nome)}</td>
        <td style="text-align:center">${esc(r.porte)}</td>
        <td>${esc(r.papel)}</td>
        <td>${esc(convName(r.convenioId))}</td>
        <td class="num">${r.n}</td>
        <td class="num" style="font-weight:700">${money(r.media)}</td>
        <td class="num" style="color:var(--muted)">${r.n>1?money0(r.min)+' – '+money0(r.max):'—'}</td>
        <td class="num" style="color:${r.taxa==null?'var(--muted)':r.taxa>=95?'var(--green)':r.taxa>=85?'var(--amber)':'var(--red)'}">${r.taxa!=null?r.taxa.toFixed(0)+'%':'—'}</td>
        <td>${fmtDate(r.ultima)}</td>
      </tr>`).join('')}
    </tbody></table>`:emptyState('Sem histórico ainda','As médias aparecem conforme você registra pagamentos (baixa) nas cirurgias.')}
    </div></div></div>`;
  $('#refq').oninput=e=>{ f.q=e.target.value; clearTimeout(window._reft); window._reft=setTimeout(viewReferencia,180); };
}

function exportBackup(){
  try{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='controldoctor-backup-'+todayISO()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast('Backup exportado');
  }catch(e){ toast('Não foi possível exportar'); }
}
function importBackup(file){
  const rd=new FileReader();
  rd.onload=()=>{
    let parsed;
    try{ parsed=JSON.parse(rd.result); }catch(e){ return toast('Arquivo inválido'); }
    if(!parsed || !Array.isArray(parsed.cirurgias) || !Array.isArray(parsed.procedimentos)) return toast('Este arquivo não é um backup do ControlDoctor');
    if(!confirm('Substituir TODOS os dados atuais pelo conteúdo do backup? Recomendado exportar antes.')) return;
    DB=parsed;
    (DB.cirurgias||[]).forEach(c=>{ if(c.paciente) c.paciente=acronimoNome(c.paciente); });
    save(); toast('Backup importado'); state.view='cirurgias'; render();
  };
  rd.readAsText(file);
}
function apagarTudo(){
  if(!confirm('Apagar TODOS os dados deste dispositivo? Exporte um backup antes — esta ação não pode ser desfeita.')) return;
  if((prompt('Digite APAGAR para confirmar:')||'').trim().toUpperCase()!=='APAGAR') return;
  try{ localStorage.removeItem(LS_DB); localStorage.removeItem(lgpdKey()); localStorage.removeItem(LS_SESSION); }catch(e){}
  DB=emptyDB(); save();
  location.reload();
}

/* ---------------- boot ---------------- */
async function boot(){
  if(SB_ON && sb){
    try{
      const { data } = await sb.auth.getSession();
      if(data && data.session){ session = { medicoId:data.session.user.id, user:data.session.user, email:data.session.user.email }; }
    }catch(e){}
    sb.auth.onAuthStateChange((_evt, s)=>{
      session = s ? { medicoId:s.user.id, user:s.user, email:s.user.email } : null;
      if(session) state.view='cirurgias';
      render();
    });
  }
  render();
}
boot();
